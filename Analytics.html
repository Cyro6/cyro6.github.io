<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.analytics-page {
    --bg-primary: #f5f0e8;
    --bg-secondary: #ede8de;
    --card-bg: #ffffff;
    --text-primary: #384743;
    --text-secondary: #a8adac;
    --header-bg: #242e2b;
    --header-hover-bg: #384743;
    --button-bg: #05bf85;
    --button-hover-bg: #008000;
    --link-color: #05bf85;
    --link-hover-color: #008000;
    --error-bg: #fce8ef;
    --table-even-row-bg: #f5f0e8;
    --table-hover-bg: #e8f5f0;
    --footer-bg: #f0ebe0;
    --shadow-color: rgba(0, 0, 0, 0.09);
    --shadow-hover-color: rgba(0, 0, 0, 0.16);
    font-family: 'Inter', sans-serif;
    background: transparent;
    padding: 20px 0;
    color: var(--text-primary);
    transition: color 0.3s ease;
    position: relative;
    margin-top: 1rem;
}
body.dark-theme .analytics-page {
    --bg-primary: #1f2937;
    --bg-secondary: #374151;
    --card-bg: #2d3748;
    --text-primary: #e5e7eb;
    --text-secondary: #9ca3af;
    --header-bg: #242e2b;
    --header-hover-bg: #384743;
    --button-bg: #05bf85;
    --button-hover-bg: #008000;
    --link-color: #05bf85;
    --link-hover-color: #34d399;
    --error-bg: #4b5563;
    --table-even-row-bg: #374151;
    --table-hover-bg: #1a3a30;
    --footer-bg: #2d3748;
    --shadow-color: rgba(0, 0, 0, 0.5);
    --shadow-hover-color: rgba(0, 0, 0, 0.7);
    background: linear-gradient(135deg, #1f2937, #2d3748);
    border-radius: 8px;
    padding: 20px;
}
.analytics-page *, .analytics-page *::before, .analytics-page *::after {
    box-sizing: border-box;
}
.analytics-page h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--link-color);
    margin: 0;
    text-shadow: 0 2px 6px var(--shadow-color);
    animation: ap-fadeIn 1s ease-in;
}
.analytics-page h2 {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--link-color);
    margin: 0 0 1.2rem;
}
@keyframes ap-fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes ap-slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
}
@keyframes ap-pulse {
    0%   { opacity: 1; }
    50%  { opacity: 0.5; }
    100% { opacity: 1; }
}
.analytics-page .card {
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 6px 25px var(--shadow-color);
    padding: 25px;
    margin: 25px auto;
    max-width: 1200px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}
.analytics-page .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px var(--shadow-hover-color);
}
.analytics-page .filter-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: var(--footer-bg);
    border-radius: 10px;
    padding: 20px;
    border: 1px solid var(--text-secondary);
}
.analytics-page .filter-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
}
.analytics-page .filter-section label {
    font-weight: 600;
    color: var(--text-primary);
    margin-right: 10px;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 0;
}
.analytics-page .filter-section label .icon {
    font-size: 1.2rem;
}
.analytics-page .filter-section select,
.analytics-page .filter-section input {
    padding: 10px;
    border: 2px solid var(--text-secondary);
    border-radius: 8px;
    font-size: 0.95rem;
    background: var(--card-bg);
    color: var(--text-primary);
    box-shadow: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
}
.analytics-page .filter-section select:focus,
.analytics-page .filter-section input:focus {
    outline: none;
    border-color: var(--link-color);
    box-shadow: 0 0 0 4px rgba(0, 128, 128, 0.2);
    transform: scale(1.02);
}
.analytics-page .filter-section input[type="text"] { width: 140px; }
.analytics-page .filter-section input[type="number"] { width: 90px; }
.analytics-page .filter-section select { width: 140px; }
.analytics-page .filter-section button,
.analytics-page #toggle-stream-table {
    padding: 10px 20px;
    background: var(--button-bg);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: none;
    margin-bottom: 20px;
    transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
}
.analytics-page .filter-section button:hover,
.analytics-page #toggle-stream-table:hover,
.analytics-page .filter-section button:focus,
.analytics-page #toggle-stream-table:focus {
    background: var(--button-hover-bg);
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 4px 15px var(--shadow-hover-color);
}
.analytics-page .month-table-container,
.analytics-page .trip-plan-container {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
.analytics-page table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
}
.analytics-page th,
.analytics-page td {
    padding: 14px;
    text-align: left;
    border-bottom: 1px solid var(--text-secondary);
    transition: background-color 0.3s ease;
}
.analytics-page th {
    background: var(--header-bg);
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.3s ease;
}
.analytics-page th:hover { background: var(--header-hover-bg); }
.analytics-page th.sort-asc::after  { content: ' ↑'; font-size: 0.9rem; }
.analytics-page th.sort-desc::after { content: ' ↓'; font-size: 0.9rem; }
.analytics-page th .header-content {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
}
.analytics-page th .header-icon { font-size: 1.2rem; }
.analytics-page tr {
    transition: background 0.2s ease, transform 0.2s ease;
    animation: ap-slideIn 0.3s ease;
}
.analytics-page tr:nth-child(even) { background: var(--table-even-row-bg); }
.analytics-page tr:hover {
    background: var(--table-hover-bg);
    transform: scale(1.01);
}
.analytics-page td a {
    color: var(--link-color);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s ease;
}
.analytics-page td a:hover { color: var(--link-hover-color); }
.analytics-page .loading {
    text-align: center;
    font-size: 1.2rem;
    color: var(--text-secondary);
    padding: 25px;
    animation: ap-pulse 1.5s infinite;
}
.analytics-page .error {
    text-align: center;
    color: #dc2626;
    font-weight: 600;
    padding: 25px;
    background: var(--error-bg);
    border-radius: 8px;
}
.analytics-page #month-error,
.analytics-page #trip-plan-error { display: none; }
.analytics-page .no-results {
    text-align: center;
    color: var(--text-secondary);
    font-size: 1.2rem;
    padding: 25px;
    background: var(--footer-bg);
    border-radius: 8px;
}
.analytics-page footer {
    text-align: center;
    margin-top: 3rem;
    padding: 1.5rem;
    background: var(--footer-bg);
    border-radius: 10px;
    box-shadow: 0 4px 15px var(--shadow-color);
}
.analytics-page footer a {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--link-color);
    transition: color 0.2s ease;
}
.analytics-page footer a:hover { color: var(--link-hover-color); }
.analytics-page th.precipitation,
.analytics-page td.precipitation { text-align: center; min-width: 120px; }
.analytics-page th.midpoint,
.analytics-page td.midpoint { text-align: center; width: 80px; }
.analytics-page td.midpoint a { font-size: 1.2rem; display: inline-block; }

@media screen and (max-width: 600px) {
    .analytics-page { padding: 12px; }
.analytics-page h1 { font-size: 1.6rem; }
    .analytics-page h2 { font-size: 1.3rem; }
    .analytics-page .card { padding: 15px; margin: 15px auto; }
    .analytics-page .filter-section { padding: 12px; }
    .analytics-page .filter-row { flex-direction: column; align-items: stretch; gap: 12px; }
    .analytics-page .filter-section select,
    .analytics-page .filter-section input,
    .analytics-page .filter-section input[type="text"],
    .analytics-page .filter-section input[type="number"] { width: 100%; font-size: 0.9rem; }
    .analytics-page .filter-section button,
    .analytics-page #toggle-stream-table { width: 100%; padding: 12px; margin-bottom: 12px; }
    .analytics-page th,
    .analytics-page td { padding: 8px; font-size: 0.85rem; white-space: normal; min-width: 80px; overflow-wrap: break-word; }
    .analytics-page th.precipitation,
    .analytics-page td.precipitation { min-width: 100px; }
    .analytics-page th.midpoint,
    .analytics-page td.midpoint { width: 60px; }
    .analytics-page th .header-content { flex-direction: column; gap: 4px; }
    .analytics-page th .header-icon { font-size: 1.1rem; }
}
@media screen and (max-width: 360px) {
    .analytics-page .month-table-container,
    .analytics-page .trip-plan-container { max-width: 360px; overflow-x: auto; }
    .analytics-page table { width: auto; }
    .analytics-page th,
    .analytics-page td { padding: 6px; font-size: 0.75rem; min-width: 60px; }
    .analytics-page th.precipitation,
    .analytics-page td.precipitation { min-width: 80px; }
    .analytics-page th.midpoint,
    .analytics-page td.midpoint { width: 50px; }
    .analytics-page th .header-content { flex-direction: column; gap: 2px; }
    .analytics-page th .header-icon { font-size: 1rem; }
}
</style>

    <script>
const DATA_URL = '/assets/data/streams.json';

let sourceData = null;
let campsiteData = null;
let processedData = null;
let allData = null;
let filteredData = [];
let sortColumn = 'Visits';
let sortDirection = -1;
const MIN_RATING = 2.0;
const DRIVING_DISTANCE_FACTOR = 1.5;
const MAX_DRIVING_DISTANCE = 30;
let isStreamTableVisible = false;
const precipitationCache = new Map();
const REQUEST_DELAY = 100;
const RETRY_DELAY = 1000;
const MAX_RETRIES = 3;
const BATCH_SIZE = 5;

function haversineDistance(lat1, lon1, lat2, lon2) {
    const R = 3958.8;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function calculateTotalRainfall(data, isPast) {
    let total = 0;
    const start = isPast ? 1 : 4;
    const end = isPast ? 4 : 8;
    for (let i = start; i < end; i++) {
        total += data.daily.precipitation_sum[i] || 0;
    }
    return total.toFixed(2);
}

async function rateLimit() {
    return new Promise(resolve => setTimeout(resolve, REQUEST_DELAY));
}

async function fetchPrecipitationData(lat, lon, retryCount = 0) {
    const key = `${Number(lat).toFixed(5)},${Number(lon).toFixed(5)}`;
    if (precipitationCache.has(key)) {
        return precipitationCache.get(key);
    }

    try {
        await rateLimit();
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum&timezone=America%2FChicago&past_days=4&forecast_days=4&precipitation_unit=inch`;
        const response = await fetch(url);
        if (response.status === 429) {
            if (retryCount < MAX_RETRIES) {
                await new Promise(resolve => setTimeout(resolve, RETRY_DELAY * (retryCount + 1)));
                return fetchPrecipitationData(lat, lon, retryCount + 1);
            } else {
                throw new Error(`HTTP 429: Too Many Requests after ${MAX_RETRIES} retries`);
            }
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const pastPrecip = calculateTotalRainfall(data, true);
        const futurePrecip = calculateTotalRainfall(data, false);
        const result = { past: `${pastPrecip} in`, future: `${futurePrecip} in` };
        precipitationCache.set(key, result);
        return result;
    } catch (error) {
        precipitationCache.set(key, { past: 'Error', future: 'Error' });
        return { past: 'Error', future: 'Error' };
    }
}

function toggleStreamTable() {
    const streamTable = document.getElementById('month-table');
    const toggleButton = document.getElementById('toggle-stream-table');
    if (!streamTable || !toggleButton) return;
    isStreamTableVisible = !isStreamTableVisible;
    streamTable.style.display = isStreamTableVisible ? 'table' : 'none';
    toggleButton.textContent = isStreamTableVisible ? 'Hide Stream Data' : 'Show Stream Data';
}

async function fetchSourceData() {
    const monthError = document.getElementById('month-error');
    const tripPlanError = document.getElementById('trip-plan-error');

    try {
        document.getElementById('month-loading').style.display = 'block';
        document.getElementById('trip-plan-loading').style.display = 'block';
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status} fetching data`);
        const data = await response.json();
        if (!data.source || !data.campsites) throw new Error('Invalid data format in streams.json');
        sourceData = data.source;
        campsiteData = data.campsites;
        processSourceData();
        populateMonthDropdown();
        populateCampsiteDropdown();
        await applyFilters();
        monthError.textContent = '';
        monthError.style.display = 'none';
        tripPlanError.textContent = '';
        tripPlanError.style.display = 'none';
    } catch (error) {
        monthError.textContent = `Error: ${error.message}`;
        monthError.style.display = 'block';
        tripPlanError.textContent = `Error: ${error.message}`;
        tripPlanError.style.display = 'block';
    } finally {
        document.getElementById('month-loading').style.display = 'none';
        document.getElementById('trip-plan-loading').style.display = 'none';
    }
}

function processSourceData() {
    if (!sourceData || !campsiteData) return;

    const ratingMap = { 'F': 0, 'E': 1, 'D': 2, 'C': 3, 'B': 4, 'A': 5, 'S': 6 };
    const excludedStreams = ['Unknown', 'Central Sands', 'Minnesota', 'Southern WI'];

    const validData = sourceData.rows
        .filter(row => {
            if (row.length < 18) return false;
            const stream = row[2]?.trim() || '';
            const rating = row[17]?.toUpperCase();
            const validRating = /^[SABCDEF]$/.test(rating);
            const validStream = !excludedStreams.some(excluded => stream.includes(excluded));
            return validRating && validStream;
        })
        .map(row => {
            const dateRaw = row[0] || '01/01/2000';
            const date = new Date(dateRaw.replace(/(\d+)\/(\d+)\/(\d+)/, '$3-$1-$2'));
            const month = isNaN(date.getTime()) ? 'Unknown' : date.toLocaleString('default', { month: 'long' });
            const stream = row[2]?.trim() || '';
            const rating = row[17]?.toUpperCase();
            const section = row[15]?.trim().toUpperCase() || 'UNKNOWN';
            const lat = parseFloat(row[12]);
            const lon = parseFloat(row[13]);
            return [month, stream, rating, section, lat, lon];
        });

    const groupedDataByMonth = {};
    validData.forEach(([month, stream, rating, section, lat, lon]) => {
        const key = `${month}|${stream}`;
        if (!groupedDataByMonth[key]) {
            groupedDataByMonth[key] = { month, stream, ratings: [], sections: [], spots: [] };
        }
        groupedDataByMonth[key].ratings.push(ratingMap[rating]);
        groupedDataByMonth[key].sections.push(section);
        if (!isNaN(lat) && !isNaN(lon)) {
            groupedDataByMonth[key].spots.push({ lat, lon });
        }
    });

    processedData = Object.values(groupedDataByMonth).map(({ month, stream, ratings, sections, spots }) => {
        const visits = ratings.length;
        const avgRating = ratings.reduce((sum, r) => sum + r, 0) / ratings.length;
        const roundedAvg = Math.round(avgRating * 100) / 100;
        const counts = { LOWER: 0, MIDDLE: 0, UPPER: 0, UNKNOWN: 0 };
        sections.forEach(s => { counts[s] = (counts[s] || 0) + 1; });
        const maxCount = Math.max(counts.LOWER, counts.MIDDLE, counts.UPPER);
        const tieCheck = (counts.LOWER === maxCount ? 1 : 0) + (counts.MIDDLE === maxCount ? 1 : 0) + (counts.UPPER === maxCount ? 1 : 0);
        let sectionResult = 'MX';
        if (maxCount > 0 && tieCheck === 1) {
            if (counts.LOWER === maxCount) sectionResult = 'L';
            else if (counts.MIDDLE === maxCount) sectionResult = 'M';
            else if (counts.UPPER === maxCount) sectionResult = 'U';
        }
        const avgLat = spots.length > 0 ? spots.reduce((sum, spot) => sum + spot.lat, 0) / spots.length : null;
        const avgLon = spots.length > 0 ? spots.reduce((sum, spot) => sum + spot.lon, 0) / spots.length : null;
        const midpoint = avgLat && avgLon ? { lat: avgLat, lon: avgLon } : null;
        return { month, stream, visits, rating: roundedAvg, section: sectionResult, midpoint };
    });

    const groupedDataAll = {};
    validData.forEach(([month, stream, rating, section, lat, lon]) => {
        if (!groupedDataAll[stream]) {
            groupedDataAll[stream] = { stream, ratings: [], sections: [], spots: [] };
        }
        groupedDataAll[stream].ratings.push(ratingMap[rating]);
        groupedDataAll[stream].sections.push(section);
        if (!isNaN(lat) && !isNaN(lon)) {
            groupedDataAll[stream].spots.push({ lat, lon });
        }
    });

    allData = Object.values(groupedDataAll).map(({ stream, ratings, sections, spots }) => {
        const visits = ratings.length;
        const avgRating = ratings.reduce((sum, r) => sum + r, 0) / ratings.length;
        const roundedAvg = Math.round(avgRating * 100) / 100;
        const counts = { LOWER: 0, MIDDLE: 0, UPPER: 0, UNKNOWN: 0 };
        sections.forEach(s => { counts[s] = (counts[s] || 0) + 1; });
        const maxCount = Math.max(counts.LOWER, counts.MIDDLE, counts.UPPER);
        const tieCheck = (counts.LOWER === maxCount ? 1 : 0) + (counts.MIDDLE === maxCount ? 1 : 0) + (counts.UPPER === maxCount ? 1 : 0);
        let sectionResult = 'MX';
        if (maxCount > 0 && tieCheck === 1) {
            if (counts.LOWER === maxCount) sectionResult = 'L';
            else if (counts.MIDDLE === maxCount) sectionResult = 'M';
            else if (counts.UPPER === maxCount) sectionResult = 'U';
        }
        const avgLat = spots.length > 0 ? spots.reduce((sum, spot) => sum + spot.lat, 0) / spots.length : null;
        const avgLon = spots.length > 0 ? spots.reduce((sum, spot) => sum + spot.lon, 0) / spots.length : null;
        const midpoint = avgLat && avgLon ? { lat: avgLat, lon: avgLon } : null;
        return { stream, visits, rating: roundedAvg, section: sectionResult, midpoint };
    });
}

function populateMonthDropdown() {
    if (!processedData) return;
    const monthOrder = ['January','February','March','April','May','June','July','August','September','October','November','December','Unknown'];
    const currentMonth = new Date().toLocaleString('default', { month: 'long' });
    const monthSelect = document.getElementById('month-select');
    if (!monthSelect) return;
    const months = [...new Set(processedData.map(row => row.month))].sort((a, b) => monthOrder.indexOf(a) - monthOrder.indexOf(b));
    months.forEach(month => {
        const option = document.createElement('option');
        option.value = month;
        option.textContent = month;
        if (month === currentMonth) option.selected = true;
        monthSelect.appendChild(option);
    });
}

function populateCampsiteDropdown() {
    if (!campsiteData) return;
    const campsiteSelect = document.getElementById('campsite-select');
    if (!campsiteSelect) return;
    campsiteData.rows.forEach(row => {
        const name = row[0]?.trim();
        const gps = row[1]?.trim();
        if (name && gps) {
            const option = document.createElement('option');
            option.value = gps;
            option.textContent = name;
            campsiteSelect.appendChild(option);
        }
    });
}

function generateTripPlan(filteredStreams, allStreams, numDays, maxDistance) {
    const tripPlan = [];
    const usedStreams = new Set();

    for (let day = 1; day <= numDays; day++) {
        let availablePrimaryStreams = filteredStreams.filter(stream => !usedStreams.has(stream.stream) && stream.midpoint);

        if (availablePrimaryStreams.length === 0) {
            tripPlan.push({ day, primary: { stream: 'None', gps: 'N/A' }, primaryPrecipitationPast: 'N/A', primaryPrecipitationFuture: 'N/A', backup: { stream: 'None', gps: 'N/A' }, backupPrecipitationPast: 'N/A', backupPrecipitationFuture: 'N/A', straightDistance: 'N/A', drivingDistance: 'N/A' });
            continue;
        }

        availablePrimaryStreams.sort((a, b) => b.rating - a.rating);
        const primaryStream = availablePrimaryStreams[0];
        usedStreams.add(primaryStream.stream);

        const backupCandidates = allStreams
            .map(stream => {
                if (!usedStreams.has(stream.stream) && stream.midpoint && stream.rating >= MIN_RATING) {
                    const distance = haversineDistance(primaryStream.midpoint.lat, primaryStream.midpoint.lon, stream.midpoint.lat, stream.midpoint.lon);
                    const drivingDistance = distance * DRIVING_DISTANCE_FACTOR;
                    if (distance <= maxDistance && drivingDistance <= MAX_DRIVING_DISTANCE) {
                        return { ...stream, distance, drivingDistance };
                    }
                }
                return null;
            })
            .filter(stream => stream !== null)
            .sort((a, b) => a.distance - b.distance);

        let backupStream;
        let straightDistance = 'N/A';
        let drivingDistance = 'N/A';
        if (backupCandidates.length > 0) {
            backupStream = backupCandidates[0];
            usedStreams.add(backupStream.stream);
            straightDistance = backupStream.distance.toFixed(2);
            drivingDistance = backupStream.drivingDistance.toFixed(2);
        } else {
            backupStream = { stream: 'None', midpoint: null, rating: 0 };
        }

        tripPlan.push({
            day,
            primary: { stream: primaryStream.stream, gps: primaryStream.midpoint ? `${primaryStream.midpoint.lat.toFixed(4)}, ${primaryStream.midpoint.lon.toFixed(4)}` : 'N/A' },
            primaryPrecipitationPast: primaryStream.midpoint ? 'Loading...' : 'N/A',
            primaryPrecipitationFuture: primaryStream.midpoint ? 'Loading...' : 'N/A',
            backup: { stream: backupStream.stream, gps: backupStream.midpoint ? `${backupStream.midpoint.lat.toFixed(4)}, ${backupStream.midpoint.lon.toFixed(4)}` : 'N/A' },
            backupPrecipitationPast: backupStream.midpoint ? 'Loading...' : 'N/A',
            backupPrecipitationFuture: backupStream.midpoint ? 'Loading...' : 'N/A',
            straightDistance,
            drivingDistance
        });
    }

    return tripPlan;
}

function displayTripPlan(tripPlan) {
    const tableBody = document.getElementById('trip-plan-body');
    const table = document.getElementById('trip-plan-table');
    const errorDiv = document.getElementById('trip-plan-error');
    if (!tableBody || !table || !errorDiv) return;

    tableBody.innerHTML = '';

    if (tripPlan.length === 0 || tripPlan.every(plan => plan.primary.stream === 'None')) {
        errorDiv.textContent = 'No streams available for the selected filters.';
        errorDiv.style.display = 'block';
        table.style.display = 'none';
        return;
    }

    errorDiv.textContent = '';
    errorDiv.style.display = 'none';
    tripPlan.forEach(plan => {
        const tr = document.createElement('tr');
        [plan.day, plan.primary.stream, plan.primaryPrecipitationPast, plan.primaryPrecipitationFuture, plan.backup.stream, plan.backupPrecipitationPast, plan.backupPrecipitationFuture, plan.straightDistance, plan.drivingDistance]
            .forEach((cell, index) => {
                const td = document.createElement('td');
                if (index === 2 || index === 3 || index === 5 || index === 6) td.classList.add('precipitation');
                if (index === 1 || index === 4) {
                    const link = document.createElement('a');
                    link.href = `stream-details.html?stream=${encodeURIComponent(cell)}`;
                    link.textContent = cell;
                    td.appendChild(link);
                } else {
                    td.textContent = cell;
                }
                tr.appendChild(td);
            });
        tableBody.appendChild(tr);
    });

    table.style.display = 'table';
}

async function processBatch(batch) {
    const results = [];
    for (const row of batch) {
        if (row.midpoint) {
            try {
                const precip = await fetchPrecipitationData(row.midpoint.lat, row.midpoint.lon);
                row.precipitationPast = precip.past;
                row.precipitationFuture = precip.future;
            } catch (error) {
                row.precipitationPast = 'Error';
                row.precipitationFuture = 'Error';
            }
        }
        results.push(row);
    }
    return results;
}

async function applyFilters() {
    const monthSelect = document.getElementById('month-select');
    const streamFilter = document.getElementById('stream-filter');
    const visitsFilter = document.getElementById('visits-filter');
    const ratingFilter = document.getElementById('rating-filter');
    const sectionFilter = document.getElementById('section-filter');
    const campsiteSelect = document.getElementById('campsite-select');
    const radiusSelect = document.getElementById('radius-select');
    const backupDistanceSelect = document.getElementById('backup-distance-select');
    const tripDaysSelect = document.getElementById('trip-days-select');
    const monthError = document.getElementById('month-error');
    const tripPlanError = document.getElementById('trip-plan-error');

    if (!monthSelect || !streamFilter || !visitsFilter || !ratingFilter || !sectionFilter || !campsiteSelect || !radiusSelect || !backupDistanceSelect || !tripDaysSelect) return;

    monthError.textContent = '';
    monthError.style.display = 'none';
    tripPlanError.textContent = '';
    tripPlanError.style.display = 'none';

    const selectedMonth = monthSelect.value || 'ALL';
    const streamFilterValue = streamFilter.value ? streamFilter.value.toLowerCase() : '';
    const visitsFilterValue = visitsFilter.value || '';
    const ratingFilterValue = ratingFilter.value || '';
    const sectionFilterValue = sectionFilter.value || 'All';
    const selectedCampsite = campsiteSelect.value;
    const selectedRadius = radiusSelect.value;
    const maxBackupDistance = parseFloat(backupDistanceSelect.value) || 20;
    const numDays = parseInt(tripDaysSelect.value) || 3;

    if (!processedData || !allData) return;

    let rowsToProcess = selectedMonth === 'ALL' ? allData : processedData.filter(row => row.month === selectedMonth);

    filteredData = rowsToProcess.map(row => {
        let distance = null;
        if (selectedCampsite !== 'ALL' && row.midpoint && selectedRadius !== 'ALL') {
            const [campLat, campLon] = selectedCampsite.split(',').map(coord => parseFloat(coord.trim()));
            distance = haversineDistance(row.midpoint.lat, row.midpoint.lon, campLat, campLon);
        }
        return { ...row, distance: distance ? distance.toFixed(2) : 'N/A', precipitationPast: row.midpoint ? 'Loading...' : 'N/A', precipitationFuture: row.midpoint ? 'Loading...' : 'N/A' };
    }).filter(row => {
        const stream = row.stream.toLowerCase();
        const visits = parseFloat(row.visits);
        const rating = parseFloat(row.rating);
        const section = row.section;
        const distance = row.distance === 'N/A' ? null : parseFloat(row.distance);
        return stream.includes(streamFilterValue) &&
               (visitsFilterValue === '' || visits >= parseFloat(visitsFilterValue)) &&
               (ratingFilterValue === '' || rating >= parseFloat(ratingFilterValue)) &&
               (sectionFilterValue === 'All' || section === sectionFilterValue) &&
               (selectedCampsite === 'ALL' || selectedRadius === 'ALL' || (distance !== null && distance <= parseFloat(selectedRadius)));
    });

    const backupStreamCandidates = rowsToProcess.filter(row => {
        const stream = row.stream.toLowerCase();
        const visits = parseFloat(row.visits);
        const rating = parseFloat(row.rating);
        const section = row.section;
        return stream.includes(streamFilterValue) &&
               (visitsFilterValue === '' || visits >= parseFloat(visitsFilterValue)) &&
               (ratingFilterValue === '' || rating >= parseFloat(ratingFilterValue)) &&
               (sectionFilterValue === 'All' || section === sectionFilterValue);
    });

    const batches = [];
    for (let i = 0; i < filteredData.length; i += BATCH_SIZE) {
        batches.push(filteredData.slice(i, i + BATCH_SIZE));
    }

    try {
        const batchResults = [];
        for (const batch of batches) {
            batchResults.push(...await processBatch(batch));
        }
        filteredData = batchResults;
    } catch (error) {
        filteredData.forEach(row => {
            if (row.precipitationPast === 'Loading...') {
                row.precipitationPast = 'Error';
                row.precipitationFuture = 'Error';
            }
        });
    }

    const columnMap = { 'Stream': 'stream', 'Visits': 'visits', 'Rating': 'rating', 'Section': 'section', 'Midpoint': 'midpoint', 'Distance': 'distance', 'Precipitation (Past 3 Days)': 'precipitationPast', 'Precipitation (Next 4 Days)': 'precipitationFuture' };

    filteredData.sort((a, b) => {
        const prop = columnMap[sortColumn];
        let valueA = a[prop];
        let valueB = b[prop];
        if (prop === 'stream' || prop === 'section') {
            return sortDirection * (valueA || '').localeCompare(valueB || '');
        } else if (prop === 'visits' || prop === 'rating' || prop === 'distance') {
            valueA = valueA === 'N/A' || valueA === null ? -Infinity : parseFloat(valueA);
            valueB = valueB === 'N/A' || valueB === null ? -Infinity : parseFloat(valueB);
            return sortDirection * (valueA - valueB);
        } else if (prop === 'midpoint') {
            valueA = valueA ? `${a.midpoint.lat.toFixed(4)},${a.midpoint.lon.toFixed(4)}` : '';
            valueB = valueB ? `${b.midpoint.lat.toFixed(4)},${b.midpoint.lon.toFixed(4)}` : '';
            return sortDirection * valueA.localeCompare(valueB);
        } else if (prop === 'precipitationPast' || prop === 'precipitationFuture') {
            valueA = valueA === 'N/A' || valueA === 'Error' || valueA === 'Loading...' ? -Infinity : parseFloat(valueA);
            valueB = valueB === 'N/A' || valueB === 'Error' || valueB === 'Loading...' ? -Infinity : parseFloat(valueB);
            return sortDirection * (valueA - valueB);
        }
        return 0;
    });

    const headers = ['Stream', 'Visits', 'Rating', 'Section', 'Midpoint', 'Distance', 'Precipitation (Past 3 Days)', 'Precipitation (Next 4 Days)'];
    const rows = filteredData.map(row => [row.stream, row.visits, row.rating, row.section, row.midpoint ? `${row.midpoint.lat.toFixed(4)}, ${row.midpoint.lon.toFixed(4)}` : 'N/A', row.distance, row.precipitationPast, row.precipitationFuture]);

    displayData({ headers, rows }, 'month');

    const tripPlan = generateTripPlan(filteredData, backupStreamCandidates, numDays, maxBackupDistance);
    const tripPlanBatches = [];
    for (let i = 0; i < tripPlan.length; i += BATCH_SIZE) {
        tripPlanBatches.push(tripPlan.slice(i, i + BATCH_SIZE));
    }

    const updatedTripPlan = [];
    for (const batch of tripPlanBatches) {
        const batchResults = await Promise.all(batch.map(async plan => {
            if (plan.primary.gps !== 'N/A') {
                const [lat, lon] = plan.primary.gps.split(',').map(coord => parseFloat(coord.trim()));
                const precip = await fetchPrecipitationData(lat, lon);
                plan.primaryPrecipitationPast = precip.past;
                plan.primaryPrecipitationFuture = precip.future;
            }
            if (plan.backup.gps !== 'N/A') {
                const [lat, lon] = plan.backup.gps.split(',').map(coord => parseFloat(coord.trim()));
                const precip = await fetchPrecipitationData(lat, lon);
                plan.backupPrecipitationPast = precip.past;
                plan.backupPrecipitationFuture = precip.future;
            }
            return plan;
        }));
        updatedTripPlan.push(...batchResults);
    }

    displayTripPlan(updatedTripPlan);
}

function clearFilters() {
    const ids = { 'stream-filter': '', 'visits-filter': '', 'rating-filter': '' };
    Object.entries(ids).forEach(([id, val]) => { const el = document.getElementById(id); if (el) el.value = val; });
    const selects = { 'section-filter': 'All', 'campsite-select': 'ALL', 'radius-select': '30', 'backup-distance-select': '20', 'trip-days-select': '3' };
    Object.entries(selects).forEach(([id, val]) => { const el = document.getElementById(id); if (el) el.value = val; });
    applyFilters();
}

function displayData({ headers, rows }, prefix) {
    const tableHeader = document.getElementById(`${prefix}-header-row`);
    const tableBody = document.getElementById(`${prefix}-body`);
    const table = document.getElementById(`${prefix}-table`);
    const noResultsDiv = document.getElementById('no-results');
    if (!tableHeader || !tableBody || !table || !noResultsDiv) return;

    tableHeader.innerHTML = '';
    tableBody.innerHTML = '';

    const iconMap = { 'Stream': '🌊', 'Visits': '👣', 'Rating': '⭐', 'Section': '📍', 'Midpoint': '🗺️', 'Distance': '📏', 'Precipitation (Past 3 Days)': '💧', 'Precipitation (Next 4 Days)': '🌦️' };

    headers.forEach(header => {
        const th = document.createElement('th');
        th.setAttribute('title', header);
        if (header.includes('Precipitation')) th.classList.add('precipitation');
        else if (header === 'Midpoint') th.classList.add('midpoint');
        const contentDiv = document.createElement('div');
        contentDiv.className = 'header-content';
        const iconSpan = document.createElement('span');
        iconSpan.className = 'header-icon';
        iconSpan.textContent = iconMap[header] || '';
        contentDiv.appendChild(iconSpan);
        th.appendChild(contentDiv);
        th.onclick = () => {
            sortColumn = sortColumn === header ? sortColumn : header;
            sortDirection = sortColumn === header ? -sortDirection : -1;
            sortColumn = header;
            applyFilters();
        };
        if (sortColumn === header) th.classList.add(sortDirection === 1 ? 'sort-asc' : 'sort-desc');
        tableHeader.appendChild(th);
    });

    if (rows.length === 0) {
        noResultsDiv.style.display = 'block';
        table.style.display = 'none';
        return;
    }

    noResultsDiv.style.display = 'none';
    rows.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach((cell, index) => {
            const td = document.createElement('td');
            if (prefix === 'month' && (index === 6 || index === 7)) {
                td.classList.add('precipitation');
                td.textContent = cell;
            } else if (prefix === 'month' && index === 4) {
                td.classList.add('midpoint');
                if (cell !== 'N/A') {
                    const [lat, lon] = cell.split(',').map(coord => parseFloat(coord.trim()));
                    const a = document.createElement('a');
                    a.href = `https://www.google.com/maps?q=${lat},${lon}`;
                    a.target = '_blank';
                    a.textContent = '🗺️';
                    td.appendChild(a);
                } else {
                    td.textContent = '-';
                }
            } else if (prefix === 'month' && index === 0) {
                const a = document.createElement('a');
                a.href = `stream-details.html?stream=${encodeURIComponent(cell)}`;
                a.textContent = cell;
                td.appendChild(a);
            } else {
                td.textContent = cell;
            }
            if (prefix === 'month' && index === 2) {
                const rating = parseFloat(cell);
                if (!isNaN(rating) && rating >= 0 && rating <= 6) {
                    if (rating <= 1) {
                        td.style.backgroundColor = '#dc2626';
                    } else if (rating <= 2.5) {
                        const ratio = (rating - 1) / 1.5;
                        td.style.backgroundColor = `rgb(${Math.round(220 + (234 - 220) * ratio)}, ${Math.round(38 + (179 - 38) * ratio)}, ${Math.round(38 + (8 - 38) * ratio)})`;
                    } else if (rating <= 4.2) {
                        const ratio = (rating - 2.5) / 1.7;
                        td.style.backgroundColor = `rgb(${Math.round(234 + (34 - 234) * ratio)}, ${Math.round(179 + (197 - 179) * ratio)}, ${Math.round(8 + (94 - 8) * ratio)})`;
                    } else {
                        td.style.backgroundColor = '#22c55e';
                    }
                }
            }
            tr.appendChild(td);
        });
        tableBody.appendChild(tr);
    });

    if (prefix === 'month') {
        table.style.display = isStreamTableVisible ? 'table' : 'none';
    } else {
        table.style.display = 'table';
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    const isMobile = window.matchMedia('(max-width: 600px)').matches;

    await fetchSourceData();

    const streamTable = document.getElementById('month-table');
    const toggleButton = document.getElementById('toggle-stream-table');
    if (streamTable && toggleButton) {
        isStreamTableVisible = !isMobile;
        streamTable.style.display = isStreamTableVisible ? 'table' : 'none';
        toggleButton.textContent = isStreamTableVisible ? 'Hide Stream Data' : 'Show Stream Data';
    }

    toggleButton.addEventListener('click', toggleStreamTable);
});
