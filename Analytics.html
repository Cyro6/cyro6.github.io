---
layout: default
title: Analytics
---
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.analytics-page {
    --bg-primary: #f5f0e8;
    --bg-secondary: #ede8de;
    --card-bg: #ffffff;
    --text-primary: #384743;
    --text-secondary: #a8adac;
    --header-bg: #242e2b;
    --header-hover-bg: #384743;
    --button-bg: #05bf85;
    --button-hover-bg: #008000;
    --link-color: #05bf85;
    --link-hover-color: #008000;
    --error-bg: #fce8ef;
    --table-even-row-bg: #f5f0e8;
    --table-hover-bg: #e8f5f0;
    --footer-bg: #f0ebe0;
    --shadow-color: rgba(0, 0, 0, 0.09);
    --shadow-hover-color: rgba(0, 0, 0, 0.16);
    font-family: 'Inter', sans-serif;
    background: transparent;
    padding: 20px 0;
    color: var(--text-primary);
    transition: color 0.3s ease;
    position: relative;
    margin-top: 1rem;
}
body.dark-theme .analytics-page {
    --bg-primary: #1f2937;
    --bg-secondary: #374151;
    --card-bg: #2d3748;
    --text-primary: #e5e7eb;
    --text-secondary: #9ca3af;
    --header-bg: #242e2b;
    --header-hover-bg: #384743;
    --button-bg: #05bf85;
    --button-hover-bg: #008000;
    --link-color: #05bf85;
    --link-hover-color: #34d399;
    --error-bg: #4b5563;
    --table-even-row-bg: #374151;
    --table-hover-bg: #1a3a30;
    --footer-bg: #2d3748;
    --shadow-color: rgba(0, 0, 0, 0.5);
    --shadow-hover-color: rgba(0, 0, 0, 0.7);
    background: linear-gradient(135deg, #1f2937, #2d3748);
    border-radius: 8px;
    padding: 20px;
}
.analytics-page *, .analytics-page *::before, .analytics-page *::after {
    box-sizing: border-box;
}
.analytics-page h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--link-color);
    margin: 0 0 1.2rem;
    text-align: center;
    text-shadow: 0 2px 6px var(--shadow-color);
    animation: ap-fadeIn 1s ease-in;
}
.analytics-page h2 {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--link-color);
    margin: 0 0 1.2rem;
}
@keyframes ap-fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes ap-slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
}
@keyframes ap-pulse {
    0%   { opacity: 1; }
    50%  { opacity: 0.5; }
    100% { opacity: 1; }
}
.analytics-page .card {
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 6px 25px var(--shadow-color);
    padding: 25px;
    margin: 25px auto;
    max-width: 1200px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}
.analytics-page .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px var(--shadow-hover-color);
}
.analytics-page .filter-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: var(--footer-bg);
    border-radius: 10px;
    padding: 20px;
    border: 1px solid var(--text-secondary);
    margin-bottom: 20px;
}
.analytics-page .filter-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
}
.analytics-page .filter-section label {
    font-weight: 600;
    color: var(--text-primary);
    margin-right: 10px;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 0;
}
.analytics-page .filter-section label .icon {
    font-size: 1.2rem;
}
.analytics-page .filter-section select,
.analytics-page .filter-section input {
    padding: 10px;
    border: 2px solid var(--text-secondary);
    border-radius: 8px;
    font-size: 0.95rem;
    background: var(--card-bg);
    color: var(--text-primary);
    box-shadow: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
}
.analytics-page .filter-section select:focus,
.analytics-page .filter-section input:focus {
    outline: none;
    border-color: var(--link-color);
    box-shadow: 0 0 0 4px rgba(0, 128, 128, 0.2);
    transform: scale(1.02);
}
.analytics-page .filter-section input[type="text"] { width: 140px; }
.analytics-page .filter-section input[type="number"] { width: 90px; }
.analytics-page .filter-section select { width: 140px; }
.analytics-page .filter-section button {
    padding: 10px 20px;
    background: var(--button-bg) !important;
    color: white !important;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: none;
    transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
}
.analytics-page .filter-section button:hover,
.analytics-page .filter-section button:focus {
    background: var(--button-hover-bg) !important;
    color: white !important;
    transform: translateY(-3px);
    box-shadow: 0 4px 15px var(--shadow-hover-color);
}
.analytics-page .month-table-container {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
.analytics-page table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
}
.analytics-page th,
.analytics-page td {
    padding: 14px;
    text-align: left;
    border-bottom: 1px solid var(--text-secondary);
    transition: background-color 0.3s ease;
}
.analytics-page th {
    background: var(--header-bg);
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.3s ease;
}
.analytics-page th:hover { background: var(--header-hover-bg); }
.analytics-page th.sort-asc::after  { content: ' ↑'; font-size: 0.9rem; }
.analytics-page th.sort-desc::after { content: ' ↓'; font-size: 0.9rem; }
.analytics-page th .header-content {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
}
.analytics-page th .header-icon { font-size: 1.2rem; }
.analytics-page tr {
    transition: background 0.2s ease, transform 0.2s ease;
    animation: ap-slideIn 0.3s ease;
}
.analytics-page tr:nth-child(even) { background: var(--table-even-row-bg); }
.analytics-page tr:hover {
    background: var(--table-hover-bg);
    transform: scale(1.01);
}
.analytics-page td a {
    color: var(--link-color);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s ease;
}
.analytics-page td a:hover { color: var(--link-hover-color); }
.analytics-page .loading {
    text-align: center;
    font-size: 1.2rem;
    color: var(--text-secondary);
    padding: 25px;
    animation: ap-pulse 1.5s infinite;
}
.analytics-page .error {
    text-align: center;
    color: #dc2626;
    font-weight: 600;
    padding: 25px;
    background: var(--error-bg);
    border-radius: 8px;
}
.analytics-page #analytics-error { display: none; }
.analytics-page .no-results {
    text-align: center;
    color: var(--text-secondary);
    font-size: 1.2rem;
    padding: 25px;
    background: var(--footer-bg);
    border-radius: 8px;
}
.analytics-page footer {
    text-align: center;
    margin-top: 3rem;
    padding: 1.5rem;
    background: var(--footer-bg);
    border-radius: 10px;
    box-shadow: 0 4px 15px var(--shadow-color);
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
}
.analytics-page footer a {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--link-color);
    transition: color 0.2s ease;
    text-decoration: none;
}
.analytics-page footer a:hover { color: var(--link-hover-color); }
.analytics-page th.midpoint,
.analytics-page td.midpoint { text-align: center; width: 80px; }
.analytics-page td.midpoint a { font-size: 1.2rem; display: inline-block; }

@media screen and (max-width: 600px) {
    .analytics-page { padding: 12px; }
    .analytics-page h1 { font-size: 1.6rem; }
    .analytics-page h2 { font-size: 1.3rem; }
    .analytics-page .card { padding: 15px; margin: 15px auto; }
    .analytics-page .filter-section { padding: 12px; }
    .analytics-page .filter-row { flex-direction: column; align-items: stretch; gap: 12px; }
    .analytics-page .filter-section select,
    .analytics-page .filter-section input,
    .analytics-page .filter-section input[type="text"],
    .analytics-page .filter-section input[type="number"] { width: 100%; font-size: 0.9rem; }
    .analytics-page .filter-section button { width: 100%; padding: 12px; }
    .analytics-page th,
    .analytics-page td { padding: 8px; font-size: 0.85rem; white-space: normal; min-width: 80px; overflow-wrap: break-word; }
    .analytics-page th.midpoint,
    .analytics-page td.midpoint { width: 60px; }
    .analytics-page th .header-content { flex-direction: column; gap: 4px; }
    .analytics-page th .header-icon { font-size: 1.1rem; }
}
@media screen and (max-width: 360px) {
    .analytics-page .month-table-container { max-width: 360px; overflow-x: auto; }
    .analytics-page table { width: auto; }
    .analytics-page th,
    .analytics-page td { padding: 6px; font-size: 0.75rem; min-width: 60px; }
    .analytics-page th.midpoint,
    .analytics-page td.midpoint { width: 50px; }
    .analytics-page th .header-content { flex-direction: column; gap: 2px; }
    .analytics-page th .header-icon { font-size: 1rem; }
}
</style>

<div class="analytics-page">
    <h1>Stream Analytics</h1>

    <div class="card">
        <h2>Stream Performance</h2>
        <div class="filter-section">
            <div class="filter-row">
                <div>
                    <label for="month-select"><span class="icon">📅</span> Month:</label>
                    <select id="month-select" onchange="applyFilters()">
                        <option value="ALL">ALL</option>
                    </select>
                </div>
                <div>
                    <label for="stream-filter"><span class="icon">🌊</span> Stream:</label>
                    <input type="text" id="stream-filter" placeholder="Stream" oninput="applyFilters()">
                </div>
                <div>
                    <label for="visits-filter"><span class="icon">👣</span> Min Visits:</label>
                    <input type="number" id="visits-filter" min="0" placeholder="Visits" oninput="applyFilters()">
                </div>
                <div>
                    <label for="rating-filter"><span class="icon">⭐</span> Min Rating:</label>
                    <input type="number" id="rating-filter" min="0" max="6" step="0.1" placeholder="Rating" oninput="applyFilters()">
                </div>
                <div>
                    <label for="section-filter"><span class="icon">📍</span> Section:</label>
                    <select id="section-filter" onchange="applyFilters()">
                        <option value="All">All</option>
                        <option value="L">L</option>
                        <option value="M">M</option>
                        <option value="U">U</option>
                        <option value="MX">MX</option>
                    </select>
                </div>
                <div>
                    <button onclick="clearFilters()">Clear Filters</button>
                </div>
            </div>
        </div>

        <div id="analytics-loading" class="loading">Loading Analytics...</div>
        <div id="analytics-error" class="error"></div>
        <div id="no-results" class="no-results" style="display: none;">No data matches the filters.</div>
        <div class="month-table-container">
            <table id="analytics-table" style="display: none;">
                <thead>
                    <tr id="analytics-header-row"></tr>
                </thead>
                <tbody id="analytics-body"></tbody>
            </table>
        </div>
    </div>

    <footer>
        <a href="/planner">Plan a Trip &rarr;</a>
        <a href="./resources.html">Resource Links</a>
    </footer>

    <script>
const DATA_URL = '/assets/data/streams.json?v={{ site.time | date: "%Y%m%d%H%M%S" }}';

let sourceData = null;
let processedData = null;
let allData = null;
let filteredData = [];
let sortColumn = 'Visits';
let sortDirection = -1;

function processSourceData() {
    if (!sourceData) return;

    const ratingMap = { 'F': 0, 'E': 1, 'D': 2, 'C': 3, 'B': 4, 'A': 5, 'S': 6 };
    const excludedStreams = ['Unknown', 'Central Sands', 'Minnesota', 'Southern WI'];

    const validData = sourceData.rows
        .filter(row => {
            if (row.length < 18) return false;
            const stream = row[2]?.trim() || '';
            const rating = row[17]?.toUpperCase();
            const validRating = /^[SABCDEF]$/.test(rating);
            const validStream = !excludedStreams.some(excluded => stream.includes(excluded));
            return validRating && validStream;
        })
        .map(row => {
            const dateRaw = row[0] || '01/01/2000';
            const _dm = dateRaw.match(/(\d+)\/(\d+)\/(\d+)/);
            const date = _dm ? new Date(+_dm[3], +_dm[1]-1, +_dm[2]) : new Date(NaN);
            const month = isNaN(date.getTime()) ? 'Unknown' : date.toLocaleString('default', { month: 'long' });
            const stream = row[2]?.trim() || '';
            const rating = row[17]?.toUpperCase();
            const section = row[15]?.trim().toUpperCase() || 'UNKNOWN';
            const lat = parseFloat(row[12]);
            const lon = parseFloat(row[13]);
            return [month, stream, rating, section, lat, lon];
        });

    const groupedDataByMonth = {};
    validData.forEach(([month, stream, rating, section, lat, lon]) => {
        const key = `${month}|${stream}`;
        if (!groupedDataByMonth[key]) {
            groupedDataByMonth[key] = { month, stream, ratings: [], sections: [], spots: [] };
        }
        groupedDataByMonth[key].ratings.push(ratingMap[rating]);
        groupedDataByMonth[key].sections.push(section);
        if (!isNaN(lat) && !isNaN(lon)) {
            groupedDataByMonth[key].spots.push({ lat, lon });
        }
    });

    processedData = Object.values(groupedDataByMonth).map(({ month, stream, ratings, sections, spots }) => {
        const visits = ratings.length;
        const avgRating = ratings.reduce((sum, r) => sum + r, 0) / ratings.length;
        const roundedAvg = Math.round(avgRating * 100) / 100;
        const counts = { LOWER: 0, MIDDLE: 0, UPPER: 0, UNKNOWN: 0 };
        sections.forEach(s => { counts[s] = (counts[s] || 0) + 1; });
        const maxCount = Math.max(counts.LOWER, counts.MIDDLE, counts.UPPER);
        const tieCheck = (counts.LOWER === maxCount ? 1 : 0) + (counts.MIDDLE === maxCount ? 1 : 0) + (counts.UPPER === maxCount ? 1 : 0);
        let sectionResult = 'MX';
        if (maxCount > 0 && tieCheck === 1) {
            if (counts.LOWER === maxCount) sectionResult = 'L';
            else if (counts.MIDDLE === maxCount) sectionResult = 'M';
            else if (counts.UPPER === maxCount) sectionResult = 'U';
        }
        const avgLat = spots.length > 0 ? spots.reduce((sum, spot) => sum + spot.lat, 0) / spots.length : null;
        const avgLon = spots.length > 0 ? spots.reduce((sum, spot) => sum + spot.lon, 0) / spots.length : null;
        const midpoint = (avgLat !== null && avgLon !== null) ? { lat: avgLat, lon: avgLon } : null;
        return { month, stream, visits, rating: roundedAvg, section: sectionResult, midpoint };
    });

    const groupedDataAll = {};
    validData.forEach(([month, stream, rating, section, lat, lon]) => {
        if (!groupedDataAll[stream]) {
            groupedDataAll[stream] = { stream, ratings: [], sections: [], spots: [] };
        }
        groupedDataAll[stream].ratings.push(ratingMap[rating]);
        groupedDataAll[stream].sections.push(section);
        if (!isNaN(lat) && !isNaN(lon)) {
            groupedDataAll[stream].spots.push({ lat, lon });
        }
    });

    allData = Object.values(groupedDataAll).map(({ stream, ratings, sections, spots }) => {
        const visits = ratings.length;
        const avgRating = ratings.reduce((sum, r) => sum + r, 0) / ratings.length;
        const roundedAvg = Math.round(avgRating * 100) / 100;
        const counts = { LOWER: 0, MIDDLE: 0, UPPER: 0, UNKNOWN: 0 };
        sections.forEach(s => { counts[s] = (counts[s] || 0) + 1; });
        const maxCount = Math.max(counts.LOWER, counts.MIDDLE, counts.UPPER);
        const tieCheck = (counts.LOWER === maxCount ? 1 : 0) + (counts.MIDDLE === maxCount ? 1 : 0) + (counts.UPPER === maxCount ? 1 : 0);
        let sectionResult = 'MX';
        if (maxCount > 0 && tieCheck === 1) {
            if (counts.LOWER === maxCount) sectionResult = 'L';
            else if (counts.MIDDLE === maxCount) sectionResult = 'M';
            else if (counts.UPPER === maxCount) sectionResult = 'U';
        }
        const avgLat = spots.length > 0 ? spots.reduce((sum, spot) => sum + spot.lat, 0) / spots.length : null;
        const avgLon = spots.length > 0 ? spots.reduce((sum, spot) => sum + spot.lon, 0) / spots.length : null;
        const midpoint = (avgLat !== null && avgLon !== null) ? { lat: avgLat, lon: avgLon } : null;
        return { stream, visits, rating: roundedAvg, section: sectionResult, midpoint };
    });
}

function populateMonthDropdown() {
    if (!processedData) return;
    const monthOrder = ['January','February','March','April','May','June','July','August','September','October','November','December','Unknown'];
    const currentMonth = new Date().toLocaleString('default', { month: 'long' });
    const monthSelect = document.getElementById('month-select');
    if (!monthSelect) return;
    const months = [...new Set(processedData.map(row => row.month))].sort((a, b) => monthOrder.indexOf(a) - monthOrder.indexOf(b));
    months.forEach(month => {
        const option = document.createElement('option');
        option.value = month;
        option.textContent = month;
        if (month === currentMonth) option.selected = true;
        monthSelect.appendChild(option);
    });
}

function getRatingColor(rating) {
    if (rating <= 1) {
        return '#dc2626';
    } else if (rating <= 2.5) {
        const ratio = (rating - 1) / 1.5;
        const r = Math.round(220 + (234 - 220) * ratio);
        const g = Math.round(38 + (179 - 38) * ratio);
        const b = Math.round(38 + (8 - 38) * ratio);
        return `rgb(${r}, ${g}, ${b})`;
    } else if (rating <= 4.2) {
        const ratio = (rating - 2.5) / 1.7;
        const r = Math.round(234 + (34 - 234) * ratio);
        const g = Math.round(179 + (197 - 179) * ratio);
        const b = Math.round(8 + (94 - 8) * ratio);
        return `rgb(${r}, ${g}, ${b})`;
    } else {
        return '#22c55e';
    }
}

function applyFilters() {
    const monthSelect = document.getElementById('month-select');
    const streamFilter = document.getElementById('stream-filter');
    const visitsFilter = document.getElementById('visits-filter');
    const ratingFilter = document.getElementById('rating-filter');
    const sectionFilter = document.getElementById('section-filter');
    const errorDiv = document.getElementById('analytics-error');

    if (!monthSelect || !streamFilter || !visitsFilter || !ratingFilter || !sectionFilter) return;
    if (!processedData || !allData) return;

    errorDiv.textContent = '';
    errorDiv.style.display = 'none';

    const selectedMonth = monthSelect.value || 'ALL';
    const streamFilterValue = streamFilter.value ? streamFilter.value.toLowerCase() : '';
    const visitsFilterValue = visitsFilter.value || '';
    const ratingFilterValue = ratingFilter.value || '';
    const sectionFilterValue = sectionFilter.value || 'All';

    let rowsToProcess = selectedMonth === 'ALL' ? allData : processedData.filter(row => row.month === selectedMonth);

    filteredData = rowsToProcess.filter(row => {
        const stream = row.stream.toLowerCase();
        const visits = parseFloat(row.visits);
        const rating = parseFloat(row.rating);
        const section = row.section;
        return stream.includes(streamFilterValue) &&
               (visitsFilterValue === '' || visits >= parseFloat(visitsFilterValue)) &&
               (ratingFilterValue === '' || rating >= parseFloat(ratingFilterValue)) &&
               (sectionFilterValue === 'All' || section === sectionFilterValue);
    });

    const columnMap = {
        'Stream': 'stream',
        'Visits': 'visits',
        'Rating': 'rating',
        'Section': 'section',
        'Midpoint': 'midpoint'
    };

    filteredData.sort((a, b) => {
        const prop = columnMap[sortColumn];
        let valueA = a[prop];
        let valueB = b[prop];
        if (prop === 'stream' || prop === 'section') {
            return sortDirection * (valueA || '').localeCompare(valueB || '');
        } else if (prop === 'visits' || prop === 'rating') {
            valueA = valueA === null ? -Infinity : parseFloat(valueA);
            valueB = valueB === null ? -Infinity : parseFloat(valueB);
            return sortDirection * (valueA - valueB);
        } else if (prop === 'midpoint') {
            valueA = valueA ? `${a.midpoint.lat.toFixed(4)},${a.midpoint.lon.toFixed(4)}` : '';
            valueB = valueB ? `${b.midpoint.lat.toFixed(4)},${b.midpoint.lon.toFixed(4)}` : '';
            return sortDirection * valueA.localeCompare(valueB);
        }
        return 0;
    });

    displayData(filteredData);
}

function displayData(rows) {
    const tableHeader = document.getElementById('analytics-header-row');
    const tableBody = document.getElementById('analytics-body');
    const table = document.getElementById('analytics-table');
    const noResultsDiv = document.getElementById('no-results');
    if (!tableHeader || !tableBody || !table || !noResultsDiv) return;

    const headers = ['Stream', 'Visits', 'Rating', 'Section', 'Midpoint'];
    const iconMap = {
        'Stream': '🌊',
        'Visits': '👣',
        'Rating': '⭐',
        'Section': '📍',
        'Midpoint': '🗺️'
    };

    tableHeader.innerHTML = '';
    headers.forEach(header => {
        const th = document.createElement('th');
        th.setAttribute('title', header);
        if (header === 'Midpoint') th.classList.add('midpoint');
        const contentDiv = document.createElement('div');
        contentDiv.className = 'header-content';
        const iconSpan = document.createElement('span');
        iconSpan.className = 'header-icon';
        iconSpan.textContent = iconMap[header] || '';
        const labelSpan = document.createElement('span');
        labelSpan.textContent = header;
        contentDiv.appendChild(iconSpan);
        contentDiv.appendChild(labelSpan);
        th.appendChild(contentDiv);
        th.onclick = () => {
            if (sortColumn === header) {
                sortDirection = -sortDirection;
            } else {
                sortColumn = header;
                sortDirection = -1;
            }
            applyFilters();
        };
        if (sortColumn === header) th.classList.add(sortDirection === 1 ? 'sort-asc' : 'sort-desc');
        tableHeader.appendChild(th);
    });

    tableBody.innerHTML = '';

    if (rows.length === 0) {
        noResultsDiv.style.display = 'block';
        table.style.display = 'none';
        return;
    }

    noResultsDiv.style.display = 'none';

    rows.forEach(row => {
        const tr = document.createElement('tr');

        // Stream (link to /stream-details)
        const tdStream = document.createElement('td');
        const streamLink = document.createElement('a');
        streamLink.href = `/stream-details?stream=${encodeURIComponent(row.stream)}`;
        streamLink.textContent = row.stream;
        tdStream.appendChild(streamLink);
        tr.appendChild(tdStream);

        // Visits
        const tdVisits = document.createElement('td');
        tdVisits.textContent = row.visits;
        tr.appendChild(tdVisits);

        // Rating (color-coded background)
        const tdRating = document.createElement('td');
        tdRating.textContent = row.rating;
        const rating = parseFloat(row.rating);
        if (!isNaN(rating) && rating >= 0 && rating <= 6) {
            tdRating.style.backgroundColor = getRatingColor(rating);
            tdRating.style.color = 'white';
            tdRating.style.fontWeight = '700';
        }
        tr.appendChild(tdRating);

        // Section
        const tdSection = document.createElement('td');
        tdSection.textContent = row.section;
        tr.appendChild(tdSection);

        // Midpoint (map link)
        const tdMidpoint = document.createElement('td');
        tdMidpoint.classList.add('midpoint');
        if (row.midpoint) {
            const mapLink = document.createElement('a');
            mapLink.href = `https://www.google.com/maps?q=${row.midpoint.lat.toFixed(4)},${row.midpoint.lon.toFixed(4)}`;
            mapLink.target = '_blank';
            mapLink.textContent = '🗺️';
            tdMidpoint.appendChild(mapLink);
        } else {
            tdMidpoint.textContent = '-';
        }
        tr.appendChild(tdMidpoint);

        tableBody.appendChild(tr);
    });

    table.style.display = 'table';
}

function clearFilters() {
    const streamFilter = document.getElementById('stream-filter');
    const visitsFilter = document.getElementById('visits-filter');
    const ratingFilter = document.getElementById('rating-filter');
    const sectionFilter = document.getElementById('section-filter');
    if (streamFilter) streamFilter.value = '';
    if (visitsFilter) visitsFilter.value = '';
    if (ratingFilter) ratingFilter.value = '';
    if (sectionFilter) sectionFilter.value = 'All';

    // Re-select current month
    const monthSelect = document.getElementById('month-select');
    if (monthSelect && processedData) {
        const currentMonth = new Date().toLocaleString('default', { month: 'long' });
        const options = Array.from(monthSelect.options);
        const match = options.find(o => o.value === currentMonth);
        if (match) monthSelect.value = currentMonth;
        else monthSelect.value = 'ALL';
    }

    sortColumn = 'Visits';
    sortDirection = -1;
    applyFilters();
}

async function fetchSourceData() {
    const loadingDiv = document.getElementById('analytics-loading');
    const errorDiv = document.getElementById('analytics-error');

    try {
        if (loadingDiv) loadingDiv.style.display = 'block';
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status} fetching data`);
        const data = await response.json();
        if (!data.source) throw new Error('Invalid data format in streams.json');
        sourceData = data.source;
        processSourceData();
        populateMonthDropdown();
        applyFilters();
        if (errorDiv) { errorDiv.textContent = ''; errorDiv.style.display = 'none'; }
    } catch (error) {
        if (errorDiv) { errorDiv.textContent = `Error: ${error.message}`; errorDiv.style.display = 'block'; }
    } finally {
        if (loadingDiv) loadingDiv.style.display = 'none';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    fetchSourceData();
});
    </script>
</div>
