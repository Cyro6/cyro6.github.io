---
layout: default
title: Stream Map
---

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
.stream-map-page {
  position: relative;
  font-family: 'Inter', sans-serif;
}
#stream-map {
  width: 100%;
  height: calc(100vh - 68px);
  z-index: 1;
}

/* ── Reset global theme styles leaking into the controls panel ──────────── */
.map-controls button,
.map-controls input,
.map-controls select,
.map-controls label {
  margin-bottom: 0;
  padding-top: 0;
  line-height: 1;
}
.map-controls button {
  padding: 0;
}

/* ── Floating controls ───────────────────────────────────────────────────── */
:root { --rh: 19px; }

.map-controls {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 900;
  background: rgba(255,255,255,0.96);
  border-radius: 10px;
  padding: 10px 12px 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  min-width: 170px;
  backdrop-filter: blur(6px);
  box-sizing: border-box;
}
body.dark-theme .map-controls {
  background: rgba(26,36,31,0.96);
  color: #e5e7eb;
  box-shadow: 0 4px 20px rgba(0,0,0,0.45);
}
.map-controls-title {
  font-size: .88rem;
  font-weight: 700;
  color: #05bf85;
  margin: 0 0 8px;
  letter-spacing: .02em;
}
#ctrl-body {
  display: flex;
  flex-direction: column;
  gap: 0;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
}
.ctrl-group {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding-top: 5px;
  margin-top: 4px;
  border-top: 1px solid #e9eaec;
}
.ctrl-group:first-child {
  padding-top: 0;
  margin-top: 0;
  border-top: none;
}
body.dark-theme .ctrl-group { border-top-color: #374151; }
.ctrl-label {
  font-size: .91rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: #05bf85;
  line-height: 1;
  margin-bottom: 2px;
}
body.dark-theme .ctrl-label { color: #6b7280; }

/* ── Toggle buttons (Color By) ── */
.ctrl-toggle {
  display: flex;
  gap: 3px;
  height: var(--rh);
}
.ctrl-toggle button {
  flex: 1;
  height: 100%;
  padding: 0;
  font-size: .69rem;
  font-weight: 600;
  border: 1.5px solid #d1d5db;
  border-radius: 5px;
  background: white;
  color: #6b7280;
  cursor: pointer;
  transition: all .15s;
  font-family: 'Inter', sans-serif;
  line-height: 1;
}
.ctrl-toggle button.active { background: #05bf85; color: white; border-color: #05bf85; }
body.dark-theme .ctrl-toggle button { background: #374151; color: #9ca3af; border-color: #4b5563; }
body.dark-theme .ctrl-toggle button.active { background: #05bf85; color: white; border-color: #05bf85; }

/* ── Checkbox rows ── */
.ctrl-check {
  display: flex;
  align-items: center;
  gap: 5px;
  height: var(--rh);
  font-size: .8rem;
  font-weight: 500;
  color: #414348;
  cursor: pointer;
  user-select: none;
  line-height: 1;
}
.ctrl-check input[type="checkbox"] {
  accent-color: #05bf85;
  width: 11px;
  height: 11px;
  margin: 0;
  cursor: pointer;
  flex-shrink: 0;
}
body.dark-theme .ctrl-check { color: #9ca3af; }

/* ── Number spinner ── */
.ctrl-num-wrap {
  display: flex;
  height: calc(var(--rh) * 1.15);
  width: 50px;
  flex-shrink: 0;
  border: 1.5px solid #d1d5db;
  border-radius: 5px;
  overflow: hidden;
}
.ctrl-num-wrap input[type="number"] {
  width: 100%;
  min-width: 0;
  height: 100%;
  border: none;
  outline: none;
  padding: 0 0 0 5px;
  font-size: .74rem;
  font-family: 'Inter', sans-serif;
  background: white;
  color: #384743;
  -moz-appearance: textfield;
  appearance: textfield;
}
.ctrl-num-wrap input[type="number"]::-webkit-inner-spin-button,
.ctrl-num-wrap input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.ctrl-num-btns {
  display: flex;
  flex-direction: column;
  border-left: 1px solid #d1d5db;
  flex-shrink: 0;
}
.ctrl-num-btns button {
  flex: 1;
  width: 15px;
  padding: 0;
  border: none;
  background: #f3f4f6;
  color: #6b7280;
  cursor: pointer;
  font-size: .48rem;
  line-height: 1;
  transition: background .1s, color .1s;
}
.ctrl-num-btns button:first-child { border-bottom: 1px solid #d1d5db; }
.ctrl-num-btns button:hover { background: #05bf85; color: white; }
body.dark-theme .ctrl-num-wrap { border-color: #4b5563; }
body.dark-theme .ctrl-num-wrap input[type="number"] { background: #2d3748; color: #e5e7eb; }
body.dark-theme .ctrl-num-btns { border-left-color: #4b5563; }
body.dark-theme .ctrl-num-btns button { background: #374151; color: #9ca3af; border-bottom-color: #4b5563; }
body.dark-theme .ctrl-num-btns button:hover { background: #05bf85; color: white; }

/* ── Number rows (label beside spinner) ── */
.ctrl-num-row {
  display: flex;
  align-items: center;
  gap: 6px;
  height: calc(var(--rh) * 1.15);
}
.ctrl-num-label {
  font-size: .8rem;
  font-weight: 500;
  color: #414348;
  line-height: 1;
}
body.dark-theme .ctrl-num-label { color: #9ca3af; }

.map-stat {
  font-size: .69rem;
  color: #9ca3af;
  text-align: center;
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid rgba(0,0,0,.07);
}
body.dark-theme .map-stat { border-top-color: rgba(255,255,255,.07); }

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: .75rem;
  color: #384743;
  font-weight: 600;
}
body.dark-theme .legend-item { color: #e5e7eb; }
.legend-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1.5px solid rgba(255,255,255,.6);
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
}

/* ── Popups ──────────────────────────────────────────────────────────────── */
.leaflet-popup-content-wrapper {
  border-radius: 10px !important;
  padding: 0 !important;
  overflow: hidden;
  box-shadow: 0 6px 24px rgba(0,0,0,.18) !important;
}
.leaflet-popup-content { margin: 0.25rem !important; }
.leaflet-popup-tip { background: #fff !important; box-shadow: none !important; }
.stream-popup {
  padding: 18px 20px;
  min-width: 270px;
  font-family: 'Inter', sans-serif;
  box-sizing: border-box;
}
.sp-name {
  font-size: 1rem;
  font-weight: 700;
  color: #05bf85;
  margin-bottom: 10px;
  line-height: 1.2;
}
.sp-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .82rem;
  color: #6b7280;
  margin-bottom: 5px;
}
.sp-row strong { color: #384743; font-weight: 600; }
.rating-pill {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 4px;
  color: white;
  font-weight: 700;
  font-size: .75rem;
}
.sp-divider {
  border: none;
  border-top: 1px solid #f0ebe0;
  margin: 9px 0 8px;
}
.sp-link {
  display: block;
  color: #05bf85;
  font-weight: 600;
  font-size: .82rem;
  text-decoration: none;
}
.sp-link:hover { color: #008000; }
.sp-notes {
  font-size: .78rem;
  color: #6b7280;
  font-style: italic;
  margin: 4px 0 6px;
  line-height: 1.4;
}

/* ── View mode badge ─────────────────────────────────────────────────────── */
.view-mode-badge {
  display: inline-block;
  font-size: .7rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: .04em;
  transition: background .2s, color .2s;
}
.view-mode-badge.streams {
  background: rgba(5,191,133,.12);
  color: #05bf85;
}
.view-mode-badge.trips {
  background: rgba(249,115,22,.12);
  color: #f97316;
}

/* ── Trip circle popup ───────────────────────────────────────────────────── */
.trip-popup {
  padding: 18px 20px;
  min-width: 260px;
  font-family: 'Inter', sans-serif;
  box-sizing: border-box;
}
.tp-name {
  font-size: .95rem;
  font-weight: 700;
  color: #05bf85;
  margin-bottom: 8px;
}
.tp-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .82rem;
  color: #6b7280;
  margin-bottom: 4px;
}
.tp-row strong { color: #384743; font-weight: 600; }
.tp-link {
  display: block;
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid #f0ebe0;
  color: #05bf85;
  font-weight: 600;
  font-size: .82rem;
  text-decoration: none;
}
.tp-link:hover { color: #008000; }
.tp-notes {
  font-size: .78rem;
  color: #6b7280;
  font-style: italic;
  margin-top: 5px;
  line-height: 1.4;
}
</style>

<div class="stream-map-page">
  <div id="stream-map"></div>

  <div class="map-controls" id="map-controls">
    <div class="map-controls-title" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="toggleControls()">
      <span style="display:flex;align-items:center;gap:6px;">
        <svg viewBox="0 0 100 120" width="11" height="13" style="display:block;fill:#05bf85;flex-shrink:0;" aria-hidden="true">
          <path d="M43,15 L72,29 L87,41 L98,49 L90,57 L91,69 L89,74 L87,106 L70,113 L39,112 L32,107 L29,86 L26,77 L19,72 L11,63 L6,30 L15,11 L36,6 Z"/>
        </svg>
        Stream Map
      </span>
      <span style="display:flex;align-items:center;gap:6px;">
        <span class="view-mode-badge streams" id="view-badge">Streams</span>
        <span id="ctrl-chevron" style="font-size:.75rem;color:#9ca3af;">▲</span>
      </span>
    </div>
    <div id="ctrl-body">

    <div class="ctrl-group">
      <span class="ctrl-label">Color By</span>
      <div class="ctrl-toggle">
        <button id="btn-recent" class="active" onclick="setColorMode('recent')" title="Color by most recent trip rating">Recent</button>
        <button id="btn-avg" onclick="setColorMode('avg')" title="Color by average rating across window">Avg</button>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Log Type</span>
      <label class="ctrl-check" title="Include trips you logged yourself"><input type="checkbox" id="chk-mine" checked onchange="updateLogFilter()"> Mine</label>
      <label class="ctrl-check" title="Include trips logged by others"><input type="checkbox" id="chk-other" checked onchange="updateLogFilter()"> Others</label>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Data</span>
      <div class="ctrl-num-row">
        <div class="ctrl-num-wrap" title="Only show streams visited at least this many times">
          <input type="number" id="map-min-visits" min="1" max="50" value="2" onchange="renderMarkers()">
          <div class="ctrl-num-btns">
            <button onclick="stepNum('map-min-visits',1)">▲</button>
            <button onclick="stepNum('map-min-visits',-1)">▼</button>
          </div>
        </div>
        <span class="ctrl-num-label">Min Visits</span>
      </div>
      <div class="ctrl-num-row">
        <div class="ctrl-num-wrap" title="Only count trips within this many years. 0 = all time.">
          <input type="number" id="map-years" min="0" max="20" value="2" onchange="renderMarkers()">
          <div class="ctrl-num-btns">
            <button onclick="stepNum('map-years',1)">▲</button>
            <button onclick="stepNum('map-years',-1)">▼</button>
          </div>
        </div>
        <span class="ctrl-num-label">Window (yrs)</span>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Overlays</span>
      <label class="ctrl-check" title="WI DNR classified trout stream regulations"><input type="checkbox" id="chk-dnr" onchange="toggleDNRLayer()"> DNR Regs</label>
      <label class="ctrl-check" title="DNR-owned land and stream easements"><input type="checkbox" id="chk-land" onchange="toggleLandLayer()"> Managed Land</label>
      <label class="ctrl-check" title="DNR parking lots near trout streams"><input type="checkbox" id="chk-parking" onchange="toggleParkingLayer()"> Parking</label>
      <label class="ctrl-check" title="Trout stream habitat improvement projects"><input type="checkbox" id="chk-habitat" onchange="toggleHabitatLayer()"> Habitat Projects</label>
      <label class="ctrl-check" title="Road bridges crossing classified trout streams"><input type="checkbox" id="chk-bridge" onchange="toggleBridgeLayer()"> Bridge Crossings</label>
      <div id="dnr-legend-inline" style="display:none;margin-top:4px;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <div class="legend-item"><span class="legend-dot" style="background:#22c55e;border-radius:2px;width:18px;height:5px;flex-shrink:0;"></span>5 trout, any length</div>
          <div class="legend-item"><span class="legend-dot" style="background:#f59e0b;border-radius:2px;width:18px;height:5px;flex-shrink:0;"></span>3 trout, 8"+ only</div>
          <div class="legend-item"><span class="legend-dot" style="background:#ef4444;border-radius:2px;width:18px;height:5px;flex-shrink:0;"></span>Varies by water</div>
          <div class="legend-item"><span class="legend-dot" style="background:#3b82f6;border-radius:2px;width:18px;height:5px;flex-shrink:0;"></span>Great Lake trib</div>
        </div>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Rating</span>
      <div id="legend-items" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
    </div>

    <div class="map-stat" id="map-stat">Loading…</div>
  </div>
</div>

<script>
const DATA_URL      = '/assets/data/streams.json?v={{ site.time | date: "%Y%m%d%H%M%S" }}';
const EXCLUDED      = ['Unknown','Central Sands','Minnesota','Southern WI'];
const ZOOM_THRESHOLD = 11;
const RATING_MAP  = {'F':0,'E':1,'D':2,'C':3,'B':4,'A':5,'S':6,'S+':7};
const RATING_KEYS = ['F','E','D','C','B','A','S','S+'];

// ── Rating helpers ────────────────────────────────────────────────────────────

function ratingColor(n) {
  if (n == null || isNaN(n)) return '#9ca3af';
  const stops = [
    [220,38,38],[249,115,22],[234,179,8],
    [132,204,22],[34,197,94],[16,185,129],[5,191,133],[3,105,161]
  ];
  const lo = Math.floor(Math.max(0, Math.min(7, n)));
  const hi = Math.min(lo + 1, 7);
  const t  = Math.max(0, Math.min(7, n)) - lo;
  const [c1,c2] = [stops[lo],stops[hi]];
  return `rgb(${Math.round(c1[0]+(c2[0]-c1[0])*t)},${Math.round(c1[1]+(c2[1]-c1[1])*t)},${Math.round(c1[2]+(c2[2]-c1[2])*t)})`;
}

function ratingToLetter(n) {
  if (n == null || isNaN(n)) return '—';
  const clamped = Math.max(0, Math.min(7, n));
  return RATING_KEYS[Math.round(clamped)] || 'S+';
}

function fmtDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ── Map init ──────────────────────────────────────────────────────────────────

const isDark  = document.body.classList.contains('dark-theme');
const tileUrl = isDark
  ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
  : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';

const map = L.map('stream-map', { zoomControl: true });
L.tileLayer(tileUrl, {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 18
}).addTo(map);

['map-controls'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  ['click','mousedown','wheel','touchstart','dblclick'].forEach(evt =>
    el.addEventListener(evt, e => e.stopPropagation(), { passive: false })
  );
});

// ── State ─────────────────────────────────────────────────────────────────────

let streamData       = [];
let allTripData      = [];
let ratedStreamLayer = L.layerGroup().addTo(map);
let tripLayer        = L.layerGroup();
let colorMode        = 'recent';
let logFilter        = 'both';
let didFitBounds     = false;
let dnrNameMap       = {};  // {user_stream_name -> matched dnr stream name (lowercase)}

map.createPane('ratedStreamsPane');
map.getPane('ratedStreamsPane').style.zIndex = 410;
let postIndex   = {};  // stream name -> [{postDate, postDays, url, title}]

fetch('/assets/data/stream_posts.json')
  .then(r => r.json())
  .then(entries => {
    entries.forEach(e => {
      (postIndex[e.stream] = postIndex[e.stream] || []).push(e);
    });
  })
  .catch(() => {});

function findPost(streamName, tripDate) {
  if (!tripDate) return null;
  const entries = postIndex[streamName] || [];
  for (const e of entries) {
    const start = new Date(e.postDate + 'T00:00:00');
    const end   = new Date(start);
    end.setDate(end.getDate() + (e.postDays || 1) - 1);
    if (tripDate >= start && tripDate <= end) return e;
  }
  return null;
}

// ── Controls ──────────────────────────────────────────────────────────────────

function setColorMode(mode) {
  colorMode = mode;
  document.getElementById('btn-recent').classList.toggle('active', mode === 'recent');
  document.getElementById('btn-avg').classList.toggle('active', mode === 'avg');
  renderMarkers();
}

function stepNum(id, delta) {
  const el = document.getElementById(id);
  const val = parseInt(el.value, 10) || parseInt(el.min, 10) || 1;
  const min = parseInt(el.min, 10);
  const max = parseInt(el.max, 10);
  el.value = Math.max(min, Math.min(max, val + delta));
  el.dispatchEvent(new Event('change'));
}

function updateLogFilter() {
  const mine  = document.getElementById('chk-mine').checked;
  const other = document.getElementById('chk-other').checked;
  logFilter = mine && other ? 'both' : mine ? 'mine' : other ? 'other' : 'none';
  renderMarkers();
}

function matchesLogFilter(whoLog) {
  if (logFilter === 'none')  return false;
  if (logFilter === 'mine')  return whoLog === 'C';
  if (logFilter === 'other') return whoLog !== 'C';
  return true;
}

function toggleControls() {
  const body    = document.getElementById('ctrl-body');
  const chevron = document.getElementById('ctrl-chevron');
  const collapsed = body.style.display === 'none';
  body.style.display    = collapsed ? '' : 'none';
  chevron.textContent   = collapsed ? '▲' : '▼';
}

// ── Marker / popup factories ──────────────────────────────────────────────────

function makeIcon(displayRating, visits) {
  const color = ratingColor(displayRating);
  const label = ratingToLetter(displayRating);
  const r   = Math.max(13, Math.min(22, 9 + Math.sqrt(visits) * 2.4));
  const sz  = Math.round(r * 2);
  const fs  = r < 17 ? 9 : 10;
  const pad = 12; // transparent touch buffer on each side
  const hit = sz + pad * 2;
  return L.divIcon({
    html: `<div style="width:${hit}px;height:${hit}px;display:flex;align-items:center;justify-content:center;">` +
          `<div style="width:${sz}px;height:${sz}px;background:${color};border-radius:50%;` +
          `display:flex;align-items:center;justify-content:center;` +
          `color:#fff;font-weight:700;font-size:${fs}px;font-family:'Inter',sans-serif;` +
          `border:2.5px solid rgba(255,255,255,.85);box-shadow:0 2px 7px rgba(0,0,0,.35);">${label}</div></div>`,
    className: '',
    iconSize:   [hit, hit],
    iconAnchor: [hit / 2, hit / 2],
    popupAnchor:[0, -(hit / 2) - 2]
  });
}

function makePopup(s) {
  const rc = ratingColor(s.recentRating);
  const ac = ratingColor(s.avgRating);
  return `<div class="stream-popup">
    <div class="sp-name">🌊 ${s.name}</div>
    <div class="sp-row"><strong>Last fished:</strong> ${fmtDate(s.recentDate)}</div>
    <div class="sp-row">
      <strong>Last rating:</strong>
      <span class="rating-pill" style="background:${rc}">${ratingToLetter(s.recentRating)}</span>
    </div>
    <div class="sp-row">
      <strong>Avg:</strong>
      <span class="rating-pill" style="background:${ac}">${ratingToLetter(s.avgRating)}</span>
      &nbsp;${s.avgRating.toFixed(2)} &middot; ${s.visits} visits
    </div>
    ${s.bestMonth ? `<div class="sp-row"><strong>Best month:</strong> ${s.bestMonth}</div>` : ''}
    ${s.recentDesc ? `<div class="sp-notes">${s.recentDesc.length > 120 ? s.recentDesc.slice(0, 120) + '…' : s.recentDesc}</div>` : ''}
    <hr class="sp-divider">
    <a class="sp-link" href="/stream-details?stream=${encodeURIComponent(s.name)}">View full history &rarr;</a>
  </div>`;
}

function makeTripPopup(t) {
  const rc = ratingColor(t.rating);
  const condParts = [t.weather].filter(Boolean);
  const post = findPost(t.name, t.date);
  return `<div class="trip-popup">
    <div class="tp-name">🌊 ${t.name}</div>
    <div class="tp-row"><strong>Date:</strong> ${fmtDate(t.date)}</div>
    <div class="tp-row">
      <strong>Rating:</strong>
      <span class="rating-pill" style="background:${rc}">${ratingToLetter(t.rating)}</span>
    </div>
    ${t.section ? `<div class="tp-row"><strong>Section:</strong> ${t.section}</div>` : ''}
    ${condParts.length ? `<div class="tp-row"><strong>Conditions:</strong> ${condParts.join(' · ')}</div>` : ''}
    ${t.desc ? `<div class="tp-notes">${t.desc.length > 140 ? t.desc.slice(0, 140) + '…' : t.desc}</div>` : ''}
    <a class="tp-link" href="/stream-details?stream=${encodeURIComponent(t.name)}">View stream history &rarr;</a>
    ${post ? `<a class="tp-link" href="${post.url}" style="border-top:none;padding-top:2px;">Read trip post &rarr;</a>` : ''}
  </div>`;
}

// ── Render ────────────────────────────────────────────────────────────────────

function buildRatingLookup() {
  const minVisits = parseInt(document.getElementById('map-min-visits').value, 10);
  const yearsBack = parseInt(document.getElementById('map-years').value) || 0;
  const cutoff    = yearsBack > 0 ? new Date(Date.now() - yearsBack * 365.25 * 86400000) : null;
  const lookup    = {};

  streamData.forEach(s => {
    const trips = (cutoff ? s.allTrips.filter(t => t.date && t.date >= cutoff) : s.allTrips)
      .filter(t => matchesLogFilter(t.whoLog));
    if (trips.length < minVisits) return;

    trips.sort((a,b) => (b.date||0) - (a.date||0));
    const recentTrip = trips[0];
    const avgRating  = trips.reduce((sum,t) => sum + t.rating, 0) / trips.length;

    const byMonth = {};
    trips.forEach(t => {
      if (!t.date) return;
      const mo = t.date.toLocaleString('default', { month: 'long' });
      (byMonth[mo] = byMonth[mo] || []).push(t.rating);
    });
    const bestMonth = Object.entries(byMonth)
      .filter(([,v]) => v.length >= 2)
      .map(([mo,v]) => ({ mo, avg: v.reduce((a,b)=>a+b,0)/v.length }))
      .sort((a,b) => b.avg - a.avg)[0]?.mo || null;

    lookup[s.name.toLowerCase().trim()] = {
      name: s.name, visits: trips.length,
      recentRating: recentTrip.rating, recentDate: recentTrip.date,
      avgRating, bestMonth, recentDesc: recentTrip.desc,
      lat: s.lat, lon: s.lon
    };
  });
  return lookup;
}

function renderStreamLines(lookup) {
  ratedStreamLayer.clearLayers();
  if (!dnrGeoJSON) return;

  const THRESHOLD_DSQ = 0.08 * 0.08; // ~9km — wide enough for long streams, filters distant same-name copies

  // Build DNR stream name -> [candidate user streams] (multiple user streams can share a DNR name)
  const dnrToUsers = {};
  Object.values(lookup).forEach(info => {
    const dnrName = (dnrNameMap[info.name] || '').toLowerCase().trim();
    if (!dnrName) return;
    (dnrToUsers[dnrName] = dnrToUsers[dnrName] || []).push(info);
  });

  // Precompute which DNR feature maps to which user stream info
  const featureMatches = new Map();
  dnrGeoJSON.features.forEach(f => {
    const dnrName    = (f.properties.STREAM || '').toLowerCase().trim();
    const candidates = dnrToUsers[dnrName];
    if (!candidates) return;

    const geom  = f.geometry;
    const lines = geom.type === 'LineString' ? [geom.coordinates] : geom.coordinates;
    let bestMatch = null, bestDsq = THRESHOLD_DSQ;

    for (const line of lines) {
      for (const [lon, lat] of line) {
        for (const c of candidates) {
          const dsq = (lon - c.lon) ** 2 + (lat - c.lat) ** 2;
          if (dsq < bestDsq) { bestDsq = dsq; bestMatch = c; }
        }
      }
    }
    if (bestMatch) featureMatches.set(f, bestMatch);
  });

  // Visible colored lines
  L.geoJSON(dnrGeoJSON, {
    pane: 'ratedStreamsPane',
    filter: f => featureMatches.has(f),
    style: f => {
      const info   = featureMatches.get(f);
      const rating = colorMode === 'recent' ? info.recentRating : info.avgRating;
      return { color: ratingColor(rating), weight: 5, opacity: 0.85 };
    },
    interactive: false,
  }).addTo(ratedStreamLayer);

  // Wide transparent hit-detection stroke for easy clicking
  L.geoJSON(dnrGeoJSON, {
    pane: 'ratedStreamsPane',
    filter: f => featureMatches.has(f),
    style: () => ({ color: 'transparent', weight: 18, opacity: 0 }),
    onEachFeature: (f, l) => {
      const info = featureMatches.get(f);
      if (info) l.bindPopup(makePopup(info), { maxWidth: 340, closeButton: true });
    },
  }).addTo(ratedStreamLayer);
}

function renderMarkers() {
  const lookup = buildRatingLookup();
  renderStreamLines(lookup);

  const bounds = Object.values(lookup).map(s => [s.lat, s.lon]);
  if (!didFitBounds && bounds.length > 0) {
    map.fitBounds(L.latLngBounds(bounds).pad(0.12));
    didFitBounds = true;
  }

  const count = Object.keys(lookup).length;
  if (map.getZoom() < ZOOM_THRESHOLD) {
    document.getElementById('map-stat').textContent =
      `${count} stream${count !== 1 ? 's' : ''} · zoom in for trips`;
  }

  renderTripMarkers();
}

function renderTripMarkers() {
  tripLayer.clearLayers();

  const yearsBack = parseInt(document.getElementById('map-years').value) || 0;
  const cutoff    = yearsBack > 0 ? new Date(Date.now() - yearsBack * 365.25 * 86400000) : null;

  let count = 0;
  allTripData.forEach(t => {
    if (cutoff && t.date && t.date < cutoff) return;
    if (!matchesLogFilter(t.whoLog)) return;

    const cm = L.circleMarker([t.lat, t.lon], {
      pane:        'markerPane',
      radius:      7,
      fillColor:   ratingColor(t.rating),
      fillOpacity: 0.88,
      color:       'rgba(255,255,255,.75)',
      weight:      1.5
    });
    cm.bindPopup(makeTripPopup(t), { maxWidth: 320, closeButton: true });
    tripLayer.addLayer(cm);
    count++;
  });

  if (map.getZoom() >= ZOOM_THRESHOLD) {
    document.getElementById('map-stat').textContent =
      `${count} trip${count !== 1 ? 's' : ''} shown`;
  }
}

// ── Zoom layer switch ─────────────────────────────────────────────────────────

function handleZoomChange() {
  const zoom  = map.getZoom();
  const badge = document.getElementById('view-badge');

  if (zoom >= ZOOM_THRESHOLD) {
    if (!map.hasLayer(tripLayer)) tripLayer.addTo(map);
    badge.className   = 'view-mode-badge trips';
    badge.textContent = 'Trips';
    const yb  = parseInt(document.getElementById('map-years').value) || 0;
    const co  = yb > 0 ? new Date(Date.now() - yb * 365.25 * 86400000) : null;
    const cnt = allTripData.filter(t => (!co || !t.date || t.date >= co) && matchesLogFilter(t.whoLog)).length;
    document.getElementById('map-stat').textContent = `${cnt} trip${cnt !== 1 ? 's' : ''} shown`;
  } else {
    if (map.hasLayer(tripLayer)) map.removeLayer(tripLayer);
    badge.className   = 'view-mode-badge streams';
    badge.textContent = 'Streams';
    let cnt = 0;
    ratedStreamLayer.eachLayer(() => cnt++);
    const streams = Math.round(cnt / 2); // two layers per stream (visible + hit)
    document.getElementById('map-stat').textContent =
      `${streams} stream${streams !== 1 ? 's' : ''} · zoom in for trips`;
  }
}

map.on('zoomend', handleZoomChange);
map.on('zoomend', () => { if (easementLayer) easementLayer.setStyle({ weight: easementWeight() }); });

// ── Legend ────────────────────────────────────────────────────────────────────

function buildLegend() {
  const grades = ['E','C','B','A','S','S+'];
  document.getElementById('legend-items').innerHTML = grades.map(g => {
    const idx = RATING_KEYS.indexOf(g);
    return `<div class="legend-item">
      <span class="legend-dot" style="background:${ratingColor(idx)}"></span>
      <span>${g}</span>
    </div>`;
  }).join('');
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────

async function init() {
  try {
    // Preload stream geometry so it's ready for renderStreamLines
    if (!dnrGeoJSON) {
      const r = await fetch('/assets/data/dnr_streams.geojson');
      if (r.ok) dnrGeoJSON = await r.json();
    }

    const json = await fetch(DATA_URL).then(r => r.json());
    dnrNameMap = json.dnr_name_map || {};
    const rows = json.source.rows;
    const raw  = {};

    rows.forEach(row => {
      const stream  = row[2]?.trim();
      const rating  = RATING_MAP[row[17]?.toUpperCase()];
      if (!stream || rating === undefined) return;
      if (EXCLUDED.some(e => stream.includes(e))) return;

      const lat = parseFloat(row[12]);
      const lon = parseFloat(row[13]);
      if (isNaN(lat) || isNaN(lon) || (Math.abs(lat) < 0.001 && Math.abs(lon) < 0.001)) return;

      if (rating === 0 || row[17]?.toUpperCase() === 'O') return; // F = scouted only, O = unrelated log

      const m        = (row[0] || '').match(/^(\d+)\/(\d+)\/(\d+)/);
      const date     = m ? new Date(+m[3], +m[1]-1, +m[2]) : null;
      const section  = row[15]?.trim() || '';
      const whoLog   = row[37]?.trim().toUpperCase() || '';
      const weather = row[23]?.trim() || '';
      const desc    = row[18]?.trim() || '';

      if (!raw[stream]) raw[stream] = { lats:[], lons:[], trips:[] };
      raw[stream].lats.push(lat);
      raw[stream].lons.push(lon);
      raw[stream].trips.push({ date, rating, whoLog, desc });

      allTripData.push({ name: stream, lat, lon, date, rating, section, whoLog, weather, desc });
    });

    streamData = Object.entries(raw).map(([name, d]) => ({
      name,
      lat: d.lats.reduce((a,b)=>a+b,0) / d.lats.length,
      lon: d.lons.reduce((a,b)=>a+b,0) / d.lons.length,
      allTrips: d.trips
    }));

    buildLegend();
    renderMarkers();
  } catch(err) {
    document.getElementById('map-stat').textContent = 'Error loading data';
    console.error(err);
  }
}

init();
