---
layout: default
title: Planner
---
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.planner-page {
    --bg-primary: #f5f0e8;
    --bg-secondary: #ede8de;
    --card-bg: #ffffff;
    --text-primary: #384743;
    --text-secondary: #a8adac;
    --header-bg: #242e2b;
    --header-hover-bg: #384743;
    --button-bg: #05bf85;
    --button-hover-bg: #008000;
    --link-color: #05bf85;
    --link-hover-color: #008000;
    --error-bg: #fce8ef;
    --table-even-row-bg: #f5f0e8;
    --table-hover-bg: #e8f5f0;
    --footer-bg: #f0ebe0;
    --shadow-color: rgba(0, 0, 0, 0.09);
    --shadow-hover-color: rgba(0, 0, 0, 0.16);
    font-family: 'Inter', sans-serif;
    background: transparent;
    padding: 20px 0;
    color: var(--text-primary);
    transition: color 0.3s ease;
    position: relative;
    margin-top: 1rem;
}
body.dark-theme .planner-page {
    --bg-primary: #1f2937;
    --bg-secondary: #374151;
    --card-bg: #2d3748;
    --text-primary: #e5e7eb;
    --text-secondary: #9ca3af;
    --header-bg: #242e2b;
    --header-hover-bg: #384743;
    --button-bg: #05bf85;
    --button-hover-bg: #008000;
    --link-color: #05bf85;
    --link-hover-color: #34d399;
    --error-bg: #4b5563;
    --table-even-row-bg: #374151;
    --table-hover-bg: #1a3a30;
    --footer-bg: #2d3748;
    --shadow-color: rgba(0, 0, 0, 0.5);
    --shadow-hover-color: rgba(0, 0, 0, 0.7);
    background: linear-gradient(135deg, #1f2937, #2d3748);
    border-radius: 8px;
    padding: 20px;
}
.planner-page *, .planner-page *::before, .planner-page *::after {
    box-sizing: border-box;
}
.planner-page h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--link-color);
    margin: 0 0 1.2rem;
    text-align: center;
    text-shadow: 0 2px 6px var(--shadow-color);
    animation: pp-fadeIn 1s ease-in;
}
.planner-page h2 {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--link-color);
    margin: 0 0 1.2rem;
}
@keyframes pp-fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes pp-slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
}
@keyframes pp-pulse {
    0%   { opacity: 1; }
    50%  { opacity: 0.5; }
    100% { opacity: 1; }
}
.planner-page .card {
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 6px 25px var(--shadow-color);
    padding: 25px;
    margin: 25px auto;
    max-width: 1200px;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}
.planner-page .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px var(--shadow-hover-color);
}
.planner-page .filter-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: var(--footer-bg);
    border-radius: 10px;
    padding: 20px;
    border: 1px solid var(--text-secondary);
    margin-bottom: 20px;
}
.planner-page .filter-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
}
.planner-page .filter-section label {
    font-weight: 600;
    color: var(--text-primary);
    margin-right: 10px;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 0;
}
.planner-page .filter-section label .icon {
    font-size: 1.2rem;
}
.planner-page .filter-section select,
.planner-page .filter-section input {
    padding: 10px;
    border: 2px solid var(--text-secondary);
    border-radius: 8px;
    font-size: 0.95rem;
    background: var(--card-bg);
    color: var(--text-primary);
    box-shadow: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
}
.planner-page .filter-section select:focus,
.planner-page .filter-section input:focus {
    outline: none;
    border-color: var(--link-color);
    box-shadow: 0 0 0 4px rgba(0, 128, 128, 0.2);
    transform: scale(1.02);
}
.planner-page .filter-section input[type="text"] { width: 140px; }
.planner-page .filter-section input[type="number"] { width: 90px; }
.planner-page .filter-section select { width: 160px; }
.planner-page .filter-section button,
.planner-page #toggle-stream-pool {
    padding: 10px 20px;
    background: var(--button-bg) !important;
    color: white !important;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: none;
    transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
}
.planner-page .filter-section button:hover,
.planner-page .filter-section button:focus,
.planner-page #toggle-stream-pool:hover,
.planner-page #toggle-stream-pool:focus {
    background: var(--button-hover-bg) !important;
    color: white !important;
    transform: translateY(-3px);
    box-shadow: 0 4px 15px var(--shadow-hover-color);
}
.planner-page #toggle-stream-pool {
    margin-bottom: 16px;
}
.planner-page .stream-pool-container {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
.planner-page table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
}
.planner-page th,
.planner-page td {
    padding: 14px;
    text-align: left;
    border-bottom: 1px solid var(--text-secondary);
    transition: background-color 0.3s ease;
}
.planner-page th {
    background: var(--header-bg);
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.3s ease;
}
.planner-page th:hover { background: var(--header-hover-bg); }
.planner-page th.sort-asc::after  { content: ' ↑'; font-size: 0.9rem; }
.planner-page th.sort-desc::after { content: ' ↓'; font-size: 0.9rem; }
.planner-page th .header-content {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
}
.planner-page th .header-icon { font-size: 1.2rem; }
.planner-page tr {
    transition: background 0.2s ease, transform 0.2s ease;
    animation: pp-slideIn 0.3s ease;
}
.planner-page tr:nth-child(even) { background: var(--table-even-row-bg); }
.planner-page tr:hover {
    background: var(--table-hover-bg);
    transform: scale(1.01);
}
.planner-page td a {
    color: var(--link-color);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s ease;
}
.planner-page td a:hover { color: var(--link-hover-color); }
.planner-page .loading {
    text-align: center;
    font-size: 1.2rem;
    color: var(--text-secondary);
    padding: 25px;
    animation: pp-pulse 1.5s infinite;
}
.planner-page .error {
    text-align: center;
    color: #dc2626;
    font-weight: 600;
    padding: 25px;
    background: var(--error-bg);
    border-radius: 8px;
}
.planner-page #trip-plan-error { display: none; }
.planner-page .no-results {
    text-align: center;
    color: var(--text-secondary);
    font-size: 1.2rem;
    padding: 25px;
    background: var(--footer-bg);
    border-radius: 8px;
}
.planner-page footer {
    text-align: center;
    margin-top: 3rem;
    padding: 1.5rem;
    background: var(--footer-bg);
    border-radius: 10px;
    box-shadow: 0 4px 15px var(--shadow-color);
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
}
.planner-page footer a {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--link-color);
    transition: color 0.2s ease;
    text-decoration: none;
}
.planner-page footer a:hover { color: var(--link-hover-color); }
.planner-page th.precipitation,
.planner-page td.precipitation { text-align: center; min-width: 120px; }
.planner-page th.midpoint,
.planner-page td.midpoint { text-align: center; width: 80px; }
.planner-page td.midpoint a { font-size: 1.2rem; display: inline-block; }

/* ── Plan A/B/C cards ─────────────────────────────────────────────────────── */
.plan-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    margin-top: 0.5rem;
}
.plan-card {
    flex: 1 1 260px;
    background: var(--bg-secondary);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px var(--shadow-color);
}
.plan-card-header {
    background: var(--header-bg);
    color: #05bf85;
    padding: 0.65rem 1.2rem;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
}
.plan-section {
    padding: 0.9rem 1.2rem;
}
.plan-section + .plan-section {
    border-top: 1px solid rgba(0,0,0,0.09);
}
body.dark-theme .plan-section + .plan-section {
    border-top-color: rgba(255,255,255,0.08);
}
.plan-section-label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-secondary);
    margin-bottom: 0.35rem;
}
.plan-stream-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
}
.plan-stream-link {
    font-size: 1rem;
    font-weight: 700;
    color: var(--link-color);
    text-decoration: none;
}
.plan-stream-link:hover { color: var(--link-hover-color); text-decoration: none; }
.plan-stream-none {
    font-size: 0.9rem;
    color: var(--text-secondary);
    font-style: italic;
}
.plan-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1rem;
    margin-top: 0.45rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
}
.trip-forecast {
    width: 100%;
    margin-top: 0.3rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.tf-row {
    display: flex;
    gap: 0.6rem;
    align-items: center;
    flex-wrap: wrap;
    font-size: 0.78rem;
}
.tf-date { font-weight: 600; min-width: 76px; color: var(--text-primary); }
.tf-period { color: var(--text-secondary); }
.tf-period b { color: var(--text-primary); }
.tf-pressure { font-size: .72rem; color: var(--text-secondary); white-space: nowrap; }
.tf-pressure .up   { color: #05bf85; }
.tf-pressure .down { color: #f97316; }
.tf-pressure .flat { color: var(--text-secondary); }

/* ── Campsite sections ────────────────────────────────────────────────────── */
.campsite-section {
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 6px 25px var(--shadow-color);
    padding: 1.2rem 1.5rem 1.5rem;
    margin: 0 auto 1.5rem;
    max-width: 1200px;
}
.campsite-section-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.1rem;
    padding-bottom: 0.9rem;
    border-bottom: 1px solid rgba(0,0,0,0.08);
}
body.dark-theme .campsite-section-header {
    border-bottom-color: rgba(255,255,255,0.08);
}
.campsite-rank {
    background: #05bf85;
    color: white;
    border-radius: 50%;
    width: 2.2rem;
    height: 2.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
    flex-shrink: 0;
}
.campsite-name {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 0.15rem;
}
.campsite-meta {
    font-size: 0.82rem;
    color: var(--text-secondary);
}

@media screen and (max-width: 600px) {
    .planner-page { padding: 12px; }
    .planner-page h1 { font-size: 1.6rem; }
    .planner-page h2 { font-size: 1.3rem; }
    .planner-page .card { padding: 15px; margin: 15px auto; }
    .planner-page .filter-section { padding: 12px; }
    .planner-page .filter-row { flex-direction: column; align-items: stretch; gap: 12px; }
    .planner-page .filter-section select,
    .planner-page .filter-section input,
    .planner-page .filter-section input[type="text"],
    .planner-page .filter-section input[type="number"] { width: 100%; font-size: 0.9rem; }
    .planner-page .filter-section button,
    .planner-page #toggle-stream-pool { width: 100%; padding: 12px; }
    .planner-page th,
    .planner-page td { padding: 8px; font-size: 0.85rem; white-space: normal; min-width: 80px; overflow-wrap: break-word; }
    .planner-page th.precipitation,
    .planner-page td.precipitation { min-width: 100px; }
    .planner-page th.midpoint,
    .planner-page td.midpoint { width: 60px; }
    .planner-page th .header-content { flex-direction: column; gap: 4px; }
    .planner-page th .header-icon { font-size: 1.1rem; }
}
@media screen and (max-width: 360px) {
    .planner-page .stream-pool-container { max-width: 360px; overflow-x: auto; }
    .planner-page table { width: auto; }
    .planner-page th,
    .planner-page td { padding: 6px; font-size: 0.75rem; min-width: 60px; }
    .planner-page th.precipitation,
    .planner-page td.precipitation { min-width: 80px; }
    .planner-page th.midpoint,
    .planner-page td.midpoint { width: 50px; }
    .planner-page th .header-content { flex-direction: column; gap: 2px; }
    .planner-page th .header-icon { font-size: 1rem; }
}
</style>

<div class="planner-page">
    <h1>Trip Planner</h1>

    <!-- Card 1: Trip Plan -->
    <div class="card">
        <h2>Trip Plan</h2>
        <div class="filter-section">
            <div class="filter-row">
                <div>
                    <label for="trip-date"><span class="icon">📅</span> Trip Date:</label>
                    <input type="date" id="trip-date" onchange="clearPrecipCache(); applyFilters();">

                <div>
                    <label for="stream-filter"><span class="icon">🌊</span> Stream:</label>
                    <input type="text" id="stream-filter" placeholder="Stream" oninput="applyFilters()">
                </div>
                <div>
                    <label for="campsite-select"><span class="icon">🏕️</span> Campsite:</label>

                <div>
                    <label for="radius-select"><span class="icon">📏</span> Radius (mi):</label>
                    <select id="radius-select" onchange="applyFilters()">
                        <option value="ALL">ALL</option>

                        <option value="20">20</option>

                        <option value="50">50</option>

                        <option value="70">70</option>
                        <option value="80">80</option>

                    <input type="number" id="visits-filter" min="0" placeholder="Visits" oninput="applyFilters()">
                </div>
                <div>
                    <label for="rating-filter"><span class="icon">⭐</span> Min Rating:</label>
                    <input type="number" id="rating-filter" min="0" max="6" step="0.1" placeholder="Rating" oninput="applyFilters()">
                </div>
                <div>
                    <label for="section-filter"><span class="icon">📍</span> Section:</label>
                    <select id="section-filter" onchange="applyFilters()">
                        <option value="All">All</option>
                        <option value="L">L</option>
                        <option value="M">M</option>
                        <option value="U">U</option>
                        <option value="MX">MX</option>
                    </select>
                </div>
                <div>
                    <label for="years-back-select"><span class="icon">🕐</span> Data Window:</label>
                    <select id="years-back-select" onchange="applyFilters()">
                        <option value="2">Last 2 yrs</option>
                        <option value="4" selected>Last 4 yrs</option>
                        <option value="6">Last 6 yrs</option>
                        <option value="8">Last 8 yrs</option>

        <div id="trip-plan-loading" class="loading" style="display: none;">Generating Trip Plan...</div>
        <div id="trip-plan-error" class="error"></div>

    <div id="campsite-plans"></div>

    <!-- Card 2: Stream Pool (collapsible) -->
    <div class="card">
        <h2>Stream Pool</h2>
        <button id="toggle-stream-pool" onclick="toggleStreamPool()">Show Stream Pool</button>
        <div id="stream-pool-wrapper" style="display: none;">
            <div id="stream-pool-loading" class="loading" style="display: none;">Loading Stream Pool...</div>
            <div id="no-pool-results" class="no-results" style="display: none;">No streams match the current filters.</div>
            <div class="stream-pool-container">
                <table id="stream-pool-table" style="display: none;">
                    <thead>
                        <tr id="stream-pool-header-row"></tr>

                    <tbody id="stream-pool-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <a href="/Analytics">&larr; Analytics</a>
        <a href="./resources.html">Resource Links</a>
    </footer>

    <script>
const DATA_URL = '/assets/data/streams.json?v={{ site.time | date: "%Y%m%d%H%M%S" }}';

const MIN_RATING = 2.0;
const DRIVING_DISTANCE_FACTOR = 1.5;
const MAX_DRIVING_DISTANCE = 30;
const REQUEST_DELAY = 100;
const RETRY_DELAY = 1000;
const MAX_RETRIES = 3;
const BATCH_SIZE = 5;
const CONFIDENCE_C = 4; // visits needed to fully trust a rating

let dnrRegData = {};

let globalAvgRating = 3.5; // updated after data loads
let sourceData = null;
let campsiteData = null;
let processedData = null;
let allData = null;
let validRows = []; // all parsed rows with dates, re-grouped per filter
let filteredData = [];
let streamPoolData = [];
let sortColumn = 'Visits';
let sortDirection = -1;
let isStreamPoolVisible = false;

const precipitationCache = new Map();

// ── Utility ──────────────────────────────────────────────────────────────────

function confidenceScore(rating, visits) {
    return (visits * rating + CONFIDENCE_C * globalAvgRating) / (visits + CONFIDENCE_C);
}

function haversineDistance(lat1, lon1, lat2, lon2) {
    const R = 3958.8;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function calculateTotalRainfall(data, isPast) {
    let total = 0;
    const start = isPast ? 0 : 7;
    const end   = isPast ? 7 : 11;
    for (let i = start; i < end; i++) {
        total += data.daily.precipitation_sum[i] || 0;
    }
    return total.toFixed(2);
}

function precipRisk(inStr) {
    const v = parseFloat(inStr);
    if (isNaN(v)) return null;
    if (v < 0.5)  return { label: 'Dry',      color: '#05bf85' };
    if (v < 1.5)  return { label: 'Elevated',  color: '#f59e0b' };
    if (v < 2.5)  return { label: 'High',      color: '#f97316' };
    return              { label: 'Risk',       color: '#ef4444' };
}

function precipRiskBadge(inStr) {
    const r = precipRisk(inStr);
    if (!r) return '';
    return `<span style="background:${r.color};color:#fff;font-size:.68rem;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px;white-space:nowrap;">${r.label}</span>`;
}

function setPrecipCell(el, val) {
    if (!el) return;
    el.innerHTML = val + precipRiskBadge(val);
}

function clearPrecipCache() {
    precipitationCache.clear();
}

function localDateStr(d) {
    const y  = d.getFullYear();
    const m  = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
}

function nextSaturday() {
    const d = new Date();
    const daysUntil = (6 - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + daysUntil);
    return localDateStr(d); // local date, not UTC
}

function getTripDaysOut() {
    const input = document.getElementById('trip-date');
    if (!input || !input.value) return 0;
    const [y, m, d] = input.value.split('-').map(Number);
    const trip  = new Date(y, m - 1, d); // local midnight — exact integer days
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.max(0, Math.round((trip - today) / 86400000));
}

function getTripDays() {
    const sel = document.getElementById('trip-days-select');
    return sel ? (parseInt(sel.value) || 1) : 1;
}

function pressureSpan(hpa, trend) {
    if (hpa == null) return '';
    let arrow = '', cls = 'flat';
    if (trend != null) {
        if (trend > 1)       { arrow = '↑'; cls = 'up'; }
        else if (trend < -1) { arrow = '↓'; cls = 'down'; }
        else                 { arrow = '→'; cls = 'flat'; }
    }
    return ` <span class="tf-pressure">${hpa}<span class="${cls}">${arrow}</span>hPa</span>`;
}

function renderForecastTable(el, result) {
    if (!el) return;
    if (!result.days || result.days.length === 0) {
        el.innerHTML = `<span style="font-size:.78rem;color:var(--text-secondary);">${result.antecedent === 'N/A' ? 'Beyond 14-day forecast range' : ''}</span>`;
        return;
    }
    el.innerHTML = result.days.map(d => {
        const dayVal   = d.day   !== null ? `${d.day}"` : 'N/A';
        const nightVal = d.night !== null ? `${d.night}"` : 'N/A';
        return `<div class="tf-row">
            <span class="tf-date">${d.label}</span>
            <span class="tf-period">☀ 6a–6p: <b>${dayVal}</b>${pressureSpan(d.dayPressure, d.dayTrend)}</span>
            <span class="tf-period">🌙 6p–6a: <b>${nightVal}</b>${pressureSpan(d.nightPressure, d.nightTrend)}</span>
        </div>`;
    }).join('');
}

async function fetchTripPrecip(lat, lon, daysOut, tripDays, retryCount = 0) {
    const N = Math.max(0, daysOut);
    if (N > 14) return { antecedent: 'N/A', days: [] };

    const pastDays    = Math.max(0, 7 - N);
    const forecastDays = Math.min(16, N + tripDays + 2); // +2: overnight window bleeds into next day
    const cacheKey    = `${Number(lat).toFixed(4)},${Number(lon).toFixed(4)},h${N}t${tripDays}`;
    if (precipitationCache.has(cacheKey)) return precipitationCache.get(cacheKey);

    try {
        await rateLimit();
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=precipitation,pressure_msl&timezone=America%2FChicago&past_days=${pastDays}&forecast_days=${forecastDays}&precipitation_unit=inch`;
        const res = await fetch(url);
        if (res.status === 429) {
            if (retryCount < MAX_RETRIES) {
                await new Promise(r => setTimeout(r, RETRY_DELAY * (retryCount + 1)));
                return fetchTripPrecip(lat, lon, daysOut, tripDays, retryCount + 1);
            }
            throw new Error('Rate limited');
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data     = await res.json();
        const hourly   = data.hourly?.precipitation || [];
        const pressure = data.hourly?.pressure_msl  || [];

        function avgPressure(startIdx, endIdx) {
            let sum = 0, n = 0;
            for (let i = startIdx; i <= endIdx; i++) {
                if (i >= 0 && i < pressure.length && pressure[i] != null) { sum += pressure[i]; n++; }
            }
            return n > 0 ? sum / n : null;
        }

        // Trip start index in the hourly array
        const tripStartIdx = (pastDays + N) * 24;

        // 7-day antecedent: 168 hours before trip start
        const antStart = Math.max(0, tripStartIdx - 168);
        let antTotal = 0;
        for (let i = antStart; i < tripStartIdx && i < hourly.length; i++) {
            antTotal += hourly[i] || 0;
        }

        // Date label helpers
        const tripDate  = new Date();
        tripDate.setHours(0, 0, 0, 0);
        tripDate.setDate(tripDate.getDate() + N);
        const DAY_NAMES   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

        // Pre-trip pressure reference (12 hrs before trip start)
        let prevPressure = avgPressure(tripStartIdx - 12, tripStartIdx - 1);

        // Per-day 12-hour windows
        const days = [];
        for (let d = 0; d < tripDays; d++) {
            const base = tripStartIdx + d * 24;

            // Daytime: hours 6–17 (6 AM to 6 PM)
            let dayTotal = 0, dayOk = false;
            for (let h = 6; h <= 17; h++) {
                const idx = base + h;
                if (idx < hourly.length) { dayTotal += hourly[idx] || 0; dayOk = true; }
            }

            // Overnight: hours 18–29 (6 PM to 6 AM next day)
            let nightTotal = 0, nightOk = false;
            for (let h = 18; h <= 29; h++) {
                const idx = base + h;
                if (idx < hourly.length) { nightTotal += hourly[idx] || 0; nightOk = true; }
            }

            const dayPressureAvg   = avgPressure(base + 6,  base + 17);
            const nightPressureAvg = avgPressure(base + 18, base + 29);
            const dayTrend   = (prevPressure != null && dayPressureAvg   != null) ? dayPressureAvg   - prevPressure : null;
            prevPressure = dayPressureAvg ?? prevPressure;
            const nightTrend = (prevPressure != null && nightPressureAvg != null) ? nightPressureAvg - prevPressure : null;
            prevPressure = nightPressureAvg ?? prevPressure;

            const date = new Date(tripDate);
            date.setDate(date.getDate() + d);
            days.push({
                label:         `${DAY_NAMES[date.getDay()]} ${MONTH_NAMES[date.getMonth()]} ${date.getDate()}`,
                day:           dayOk   ? dayTotal.toFixed(2)   : null,
                night:         nightOk ? nightTotal.toFixed(2) : null,
                dayPressure:   dayPressureAvg   != null ? Math.round(dayPressureAvg)   : null,
                nightPressure: nightPressureAvg != null ? Math.round(nightPressureAvg) : null,
                dayTrend,
                nightTrend,
            });
        }

        const result = { antecedent: `${antTotal.toFixed(2)} in`, days };
        precipitationCache.set(cacheKey, result);
        return result;
    } catch {
        const err = { antecedent: 'Error', days: [] };
        precipitationCache.set(cacheKey, err);
        return err;
    }
}

async function rateLimit() {
    return new Promise(resolve => setTimeout(resolve, REQUEST_DELAY));
}

async function fetchPrecipitationData(lat, lon, retryCount = 0) {
    const key = `${Number(lat).toFixed(5)},${Number(lon).toFixed(5)}`;
    if (precipitationCache.has(key)) return precipitationCache.get(key);

    try {
        await rateLimit();
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum&timezone=America%2FChicago&past_days=7&forecast_days=4&precipitation_unit=inch`;
        const response = await fetch(url);
        if (response.status === 429) {
            if (retryCount < MAX_RETRIES) {
                await new Promise(resolve => setTimeout(resolve, RETRY_DELAY * (retryCount + 1)));
                return fetchPrecipitationData(lat, lon, retryCount + 1);
            } else {
                throw new Error(`HTTP 429: Too Many Requests after ${MAX_RETRIES} retries`);
            }
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const result = {
            past:   `${calculateTotalRainfall(data, true)} in`,
            future: `${calculateTotalRainfall(data, false)} in`
        };
        precipitationCache.set(key, result);
        return result;
    } catch (error) {
        const errResult = { past: 'Error', future: 'Error' };
        precipitationCache.set(key, errResult);
        return errResult;
    }
}

async function processBatch(batch) {
    const results = [];
    for (const row of batch) {
        if (row.midpoint) {
            try {
                const precip = await fetchPrecipitationData(row.midpoint.lat, row.midpoint.lon);
                row.precipitationPast   = precip.past;
                row.precipitationFuture = precip.future;
            } catch (e) {
                row.precipitationPast   = 'Error';
                row.precipitationFuture = 'Error';
            }
        }
        results.push(row);
    }
    return results;
}

// ── Data processing ───────────────────────────────────────────────────────────

function processSourceData() {
    if (!sourceData || !campsiteData) return;

    const ratingMap = { 'F': 0, 'E': 1, 'D': 2, 'C': 3, 'B': 4, 'A': 5, 'S': 6, 'S+': 7 };
    const excludedStreams = ['Unknown', 'Central Sands', 'Minnesota', 'Southern WI'];

    validRows = sourceData.rows
        .filter(row => {
            if (row.length < 18) return false;
            const stream = row[2]?.trim() || '';
            const rating = row[17]?.toUpperCase();
            return /^[SABCDE]$/.test(rating) && !excludedStreams.some(e => stream.includes(e));
        })
        .map(row => {
            const dateRaw = row[0] || '';
            const _dm = dateRaw.match(/(\d+)\/(\d+)\/(\d+)/);
            const d = _dm ? new Date(+_dm[3], +_dm[1]-1, +_dm[2]) : null;
            const date = d && !isNaN(d.getTime()) ? d : null;
            const month = date ? date.toLocaleString('default', { month: 'long' }) : 'Unknown';
            return {
                date,
                month,
                stream:  row[2]?.trim() || '',
                rating:  ratingMap[row[17]?.toUpperCase()],
                section: row[15]?.trim().toUpperCase() || 'UNKNOWN',
                lat:     parseFloat(row[12]),
                lon:     parseFloat(row[13])
            };
        });

    // Build full grouped data (no date filter) for the month dropdown
    const { processed, all, avg } = buildGroupedData(validRows);
    processedData   = processed;
    allData         = all;
    globalAvgRating = avg;
}

function buildGroupedData(rows) {
    const byMonth  = {};
    const byStream = {};

    rows.forEach(({ month, stream, rating, section, lat, lon }) => {
        const key = `${month}|${stream}`;
        if (!byMonth[key]) byMonth[key] = { month, stream, ratings: [], sections: [], spots: [] };
        byMonth[key].ratings.push(rating);
        byMonth[key].sections.push(section);
        if (!isNaN(lat) && !isNaN(lon)) byMonth[key].spots.push({ lat, lon });

        if (!byStream[stream]) byStream[stream] = { stream, ratings: [], sections: [], spots: [] };
        byStream[stream].ratings.push(rating);
        byStream[stream].sections.push(section);
        if (!isNaN(lat) && !isNaN(lon)) byStream[stream].spots.push({ lat, lon });
    });

    const processed = Object.values(byMonth).map(e => buildEntry(e));
    const all       = Object.values(byStream).map(e => buildEntryAll(e));
    const avg       = all.length > 0 ? all.reduce((s, x) => s + x.rating, 0) / all.length : 3.5;
    return { processed, all, avg };
}

function buildEntry({ month, stream, ratings, sections, spots }) {
    const result = buildStats(ratings, sections, spots);
    return { month, stream, ...result };
}

function buildEntryAll({ stream, ratings, sections, spots }) {
    const result = buildStats(ratings, sections, spots);
    return { stream, ...result };
}

function buildStats(ratings, sections, spots) {
    const visits = ratings.length;
    const avgRating = ratings.reduce((sum, r) => sum + r, 0) / ratings.length;
    const roundedAvg = Math.round(avgRating * 100) / 100;

    const counts = { LOWER: 0, MIDDLE: 0, UPPER: 0, UNKNOWN: 0 };
    sections.forEach(s => { counts[s] = (counts[s] || 0) + 1; });
    const maxCount = Math.max(counts.LOWER, counts.MIDDLE, counts.UPPER);
    const tieCheck = (counts.LOWER === maxCount ? 1 : 0) +
                     (counts.MIDDLE === maxCount ? 1 : 0) +
                     (counts.UPPER === maxCount ? 1 : 0);
    let sectionResult = 'MX';
    if (maxCount > 0 && tieCheck === 1) {
        if (counts.LOWER === maxCount)       sectionResult = 'L';
        else if (counts.MIDDLE === maxCount) sectionResult = 'M';
        else if (counts.UPPER === maxCount)  sectionResult = 'U';
    }

    const avgLat = spots.length > 0 ? spots.reduce((sum, s) => sum + s.lat, 0) / spots.length : null;
    const avgLon = spots.length > 0 ? spots.reduce((sum, s) => sum + s.lon, 0) / spots.length : null;
    const midpoint = (avgLat !== null && avgLon !== null) ? { lat: avgLat, lon: avgLon } : null;

    return { visits, rating: roundedAvg, section: sectionResult, midpoint };
}

// ── Trip plan generation ──────────────────────────────────────────────────────

function generateTripPlan(filteredStreams, allStreams, numDays, maxBackupDistance) {
    const tripPlan = [];
    const usedStreams = new Set();

    for (let day = 1; day <= numDays; day++) {
        const availablePrimary = filteredStreams.filter(s => !usedStreams.has(s.stream) && s.midpoint);

        if (availablePrimary.length === 0) {
            tripPlan.push({
                day,
                primary: { stream: 'None', gps: 'N/A' },
                primaryPrecipitationPast: 'N/A', primaryPrecipitationFuture: 'N/A',
                backup: { stream: 'None', gps: 'N/A' },
                backupPrecipitationPast: 'N/A', backupPrecipitationFuture: 'N/A',
                straightDistance: 'N/A', drivingDistance: 'N/A'
            });
            continue;
        }

        availablePrimary.sort((a, b) => confidenceScore(b.rating, b.visits) - confidenceScore(a.rating, a.visits));
        const primaryStream = availablePrimary[0];
        usedStreams.add(primaryStream.stream);

        const backupCandidates = allStreams
            .map(stream => {
                if (!usedStreams.has(stream.stream) && stream.midpoint && stream.rating >= MIN_RATING) {
                    const distance = haversineDistance(
                        primaryStream.midpoint.lat, primaryStream.midpoint.lon,
                        stream.midpoint.lat, stream.midpoint.lon
                    );
                    const drivingDistance = distance * DRIVING_DISTANCE_FACTOR;
                    if (distance <= maxBackupDistance && drivingDistance <= MAX_DRIVING_DISTANCE) {
                        return { ...stream, distance, drivingDistance };
                    }
                }
                return null;
            })
            .filter(Boolean)
            .sort((a, b) => a.distance - b.distance);

        let backupStream;
        let straightDistance = 'N/A';
        let drivingDistance  = 'N/A';

        if (backupCandidates.length > 0) {
            backupStream = backupCandidates[0];
            usedStreams.add(backupStream.stream);
            straightDistance = backupStream.distance.toFixed(2);
            drivingDistance  = backupStream.drivingDistance.toFixed(2);
        } else {
            backupStream = { stream: 'None', midpoint: null, rating: 0 };
        }

        const primaryGps = primaryStream.midpoint
            ? `${primaryStream.midpoint.lat.toFixed(4)},${primaryStream.midpoint.lon.toFixed(4)}`
            : 'N/A';
        const backupGps = backupStream.midpoint
            ? `${backupStream.midpoint.lat.toFixed(4)},${backupStream.midpoint.lon.toFixed(4)}`
            : 'N/A';

        tripPlan.push({
            day,
            primary: { stream: primaryStream.stream, gps: primaryGps },
            primaryRating: primaryStream.rating,
            primaryPrecipitationPast:   primaryStream.midpoint ? '...' : 'N/A',
            primaryPrecipitationFuture: primaryStream.midpoint ? '...' : 'N/A',
            backup: { stream: backupStream.stream, gps: backupGps },
            backupRating: backupStream.rating,
            backupPrecipitationPast:   backupStream.midpoint ? '...' : 'N/A',
            backupPrecipitationFuture: backupStream.midpoint ? '...' : 'N/A',
            straightDistance,
            drivingDistance
        });
    }

    return tripPlan;
}

// ── Display helpers ───────────────────────────────────────────────────────────

function getRatingColor(rating) {
    if (rating <= 1) {
        return '#dc2626';
    } else if (rating <= 2.5) {
        const ratio = (rating - 1) / 1.5;
        return `rgb(${Math.round(220 + (234 - 220) * ratio)}, ${Math.round(38 + (179 - 38) * ratio)}, ${Math.round(38 + (8 - 38) * ratio)})`;
    } else if (rating <= 4.2) {
        const ratio = (rating - 2.5) / 1.7;
        return `rgb(${Math.round(234 + (34 - 234) * ratio)}, ${Math.round(179 + (197 - 179) * ratio)}, ${Math.round(8 + (94 - 8) * ratio)})`;
    } else {
        return '#22c55e';
    }
}

function ratingToLetter(avg) {
    if (avg === null || avg === undefined || isNaN(avg)) return '—';
    const letters = ['F', 'E', 'D', 'C', 'B', 'A', 'S'];
    const clamped = Math.max(0, Math.min(6.99, avg));
    const base = Math.floor(clamped);
    const letter = letters[Math.min(base, 6)];
    return (clamped - base) >= 0.5 ? letter + '+' : letter;
}

function ratingBadge(avg) {
    const span = document.createElement('span');
    span.textContent = ratingToLetter(avg);
    span.style.cssText =
        'display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;' +
        `background:${getRatingColor(avg)};color:white;font-size:0.75rem;font-weight:700;vertical-align:middle;`;
    return span;
}

function streamLink(streamName) {

// ── Campsite scoring & display ────────────────────────────────────────────────

function getTopCampsites(streams, radius, n = 2) {
    return campsiteData.rows
        .map(row => {
            const name = row[0]?.trim();
            const gps  = row[1]?.trim();
            if (!name || !gps) return null;
            const parts = gps.split(',').map(parseFloat);
            if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
            const [lat, lon] = parts;
            const nearby = streams
                .filter(s => s.midpoint)
                .map(s => ({ ...s, campsiteDist: haversineDistance(lat, lon, s.midpoint.lat, s.midpoint.lon) }))
                .filter(s => s.campsiteDist <= radius)
                .sort((a, b) => b.rating - a.rating);
            if (nearby.length === 0) return null;
            const score = nearby.slice(0, 5).reduce((sum, s) => sum + confidenceScore(s.rating, s.visits), 0);
            return { name, lat, lon, score, count: nearby.length, nearby };
        })
        .filter(Boolean)
        .sort((a, b) => b.score - a.score || b.count - a.count)
        .slice(0, n);
}

function displayCampsitePlans(campsites, numDays, maxBackupDist, allStreams) {
    const container = document.getElementById('campsite-plans');
    const errorDiv  = document.getElementById('trip-plan-error');
    container.innerHTML = '';

    if (campsites.length === 0) {
        errorDiv.textContent = 'No campsites have qualifying streams within the selected radius. Try increasing the radius.';
        errorDiv.style.display = 'block';
        return;
    }
    errorDiv.style.display = 'none';
    errorDiv.textContent = '';

    campsites.forEach((campsite, csIdx) => {
        const section = document.createElement('div');
        section.className = 'campsite-section';

        const hdr = document.createElement('div');
        hdr.className = 'campsite-section-header';

        const rank = document.createElement('div');
        rank.className = 'campsite-rank';
        rank.textContent = csIdx + 1;
        hdr.appendChild(rank);

        const info = document.createElement('div');
        info.style.flex = '1';
        const nameEl = document.createElement('div');
        nameEl.className = 'campsite-name';
        nameEl.textContent = campsite.name;
        info.appendChild(nameEl);
        const metaEl = document.createElement('div');
        metaEl.className = 'campsite-meta';
        const mapUrl = `https://www.google.com/maps?q=${campsite.lat.toFixed(4)},${campsite.lon.toFixed(4)}`;
        metaEl.innerHTML = `${campsite.count} qualifying stream${campsite.count !== 1 ? 's' : ''} nearby &nbsp;·&nbsp; <a href="${mapUrl}" target="_blank" style="color:var(--link-color);font-weight:600;text-decoration:none;">Open in Maps</a>`;
        info.appendChild(metaEl);
        hdr.appendChild(info);
        section.appendChild(hdr);

        const cardsEl = document.createElement('div');
        cardsEl.className = 'plan-cards';
        section.appendChild(cardsEl);
        container.appendChild(section);

        const tripPlan = generateTripPlan(campsite.nearby, allStreams, numDays, maxBackupDist);
        displayTripPlan(tripPlan, cardsEl, `c${csIdx}`);
    });
}

function displayStreamPool(rows) {
    const headerRow    = document.getElementById('stream-pool-header-row');
    const tableBody    = document.getElementById('stream-pool-body');
    const table        = document.getElementById('stream-pool-table');
    const noResultsDiv = document.getElementById('no-pool-results');
    if (!headerRow || !tableBody || !table || !noResultsDiv) return;

    const headers = ['Stream', 'Visits', 'Rating', 'Section', '7-Day Rain', '4-Day Fcst', 'Midpoint'];
    const iconMap = {
        'Stream':       '🌊',
        'Visits':       '👣',
        'Rating':       '⭐',
        'Section':      '📍',
        '7-Day Rain':  '💧',
        '4-Day Fcst':  '🌦️',
        'Midpoint':     '🗺️'
    };

    // Build header
    headerRow.innerHTML = '';
    headers.forEach(header => {
        const th = document.createElement('th');
        th.setAttribute('title', header);
        if (header === '7-Day Rain' || header === '4-Day Fcst') th.classList.add('precipitation');
        if (header === 'Midpoint') th.classList.add('midpoint');
        const contentDiv = document.createElement('div');
        contentDiv.className = 'header-content';
        const iconSpan = document.createElement('span');
        iconSpan.className = 'header-icon';
        iconSpan.textContent = iconMap[header] || '';
        const labelSpan = document.createElement('span');
        labelSpan.textContent = header;
        contentDiv.appendChild(iconSpan);
        contentDiv.appendChild(labelSpan);
        th.appendChild(contentDiv);
        th.onclick = () => {
            if (sortColumn === header) {
                sortDirection = -sortDirection;
            } else {
                sortColumn = header;
                sortDirection = -1;
            }
            rebuildStreamPool();
        };
        if (sortColumn === header) th.classList.add(sortDirection === 1 ? 'sort-asc' : 'sort-desc');
        headerRow.appendChild(th);
    });

    tableBody.innerHTML = '';

    if (rows.length === 0) {
        noResultsDiv.style.display = 'block';
        table.style.display = 'none';
        return;
    }

    noResultsDiv.style.display = 'none';

    rows.forEach((row, rowIdx) => {
        const tr = document.createElement('tr');

        // Stream
        const tdStream = document.createElement('td');
        tdStream.appendChild(streamLink(row.stream));
        tr.appendChild(tdStream);

        // Visits
        const tdVisits = document.createElement('td');
        tdVisits.textContent = row.visits;
        tr.appendChild(tdVisits);

        // Rating (color-coded)
        const tdRating = document.createElement('td');
        const rating = parseFloat(row.rating);
        tdRating.textContent = ratingToLetter(rating);
        if (!isNaN(rating) && rating >= 0 && rating <= 6) {
            tdRating.style.backgroundColor = getRatingColor(rating);
            tdRating.style.color = 'white';
            tdRating.style.fontWeight = '700';
        }
        tr.appendChild(tdRating);

        // Section
        const tdSection = document.createElement('td');
        tdSection.textContent = row.section;
        tr.appendChild(tdSection);

        // Precip Past
        const tdPPast = document.createElement('td');
        tdPPast.classList.add('precipitation');
        tdPPast.id = `sp-past-${rowIdx}`;
        const pv = row.precipitationPast;
        if (pv && pv !== '...' && pv !== 'N/A' && pv !== 'Error') {
            setPrecipCell(tdPPast, pv);
        } else {
            tdPPast.textContent = pv || '...';
        }
        tr.appendChild(tdPPast);

        // Precip Future
        const tdPFuture = document.createElement('td');
        tdPFuture.classList.add('precipitation');
        tdPFuture.id = `sp-future-${rowIdx}`;
        tdPFuture.textContent = row.precipitationFuture || '...';
        tr.appendChild(tdPFuture);

        // Midpoint map link
        const tdMidpoint = document.createElement('td');
        tdMidpoint.classList.add('midpoint');
        if (row.midpoint) {
            const mapLink = document.createElement('a');
            mapLink.href = `https://www.google.com/maps?q=${row.midpoint.lat.toFixed(4)},${row.midpoint.lon.toFixed(4)}`;
            mapLink.target = '_blank';
            mapLink.textContent = '🗺️';
            tdMidpoint.appendChild(mapLink);
        } else {
            tdMidpoint.textContent = '-';
        }
        tr.appendChild(tdMidpoint);

        tableBody.appendChild(tr);
    });

    table.style.display = 'table';

    // Fetch precipitation for stream pool rows that still need it
    rows.forEach(async (row, rowIdx) => {
        if (row.midpoint && (!row.precipitationPast || row.precipitationPast === '...')) {
            const precip = await fetchPrecipitationData(row.midpoint.lat, row.midpoint.lon);
            row.precipitationPast   = precip.past;
            row.precipitationFuture = precip.future;
            const pastCell   = document.getElementById(`sp-past-${rowIdx}`);
            const futureCell = document.getElementById(`sp-future-${rowIdx}`);
            if (pastCell)   setPrecipCell(pastCell, precip.past);
            if (futureCell) futureCell.textContent = precip.future;
        }
    });
}

function rebuildStreamPool() {
    if (!streamPoolData || streamPoolData.length === 0) return;

    const columnMap = {
        'Stream':       'stream',
        'Visits':       'visits',
        'Rating':       'rating',
        'Section':      'section',
        '7-Day Rain':   'precipitationPast',
        '4-Day Fcst':   'precipitationFuture',
        'Midpoint':     'midpoint'
    };

    const sorted = [...streamPoolData].sort((a, b) => {
        const prop = columnMap[sortColumn] || 'visits';
        let valueA = a[prop];
        let valueB = b[prop];
        if (prop === 'stream' || prop === 'section') {
            return sortDirection * (valueA || '').localeCompare(valueB || '');
        } else if (prop === 'visits' || prop === 'rating') {
            valueA = valueA === null ? -Infinity : parseFloat(valueA);
            valueB = valueB === null ? -Infinity : parseFloat(valueB);
            return sortDirection * (valueA - valueB);
        } else if (prop === 'midpoint') {
            valueA = valueA ? `${a.midpoint.lat.toFixed(4)},${a.midpoint.lon.toFixed(4)}` : '';
            valueB = valueB ? `${b.midpoint.lat.toFixed(4)},${b.midpoint.lon.toFixed(4)}` : '';
            return sortDirection * valueA.localeCompare(valueB);
        } else if (prop === 'precipitationPast' || prop === 'precipitationFuture') {
            valueA = (valueA === 'N/A' || valueA === 'Error' || valueA === '...') ? -Infinity : parseFloat(valueA);
            valueB = (valueB === 'N/A' || valueB === 'Error' || valueB === '...') ? -Infinity : parseFloat(valueB);
            return sortDirection * (valueA - valueB);
        }
        return 0;
    });

    displayStreamPool(sorted);
}

// ── Main filter/apply ─────────────────────────────────────────────────────────

async function applyFilters() {
    const monthSelect          = document.getElementById('month-select');
    const streamFilter         = document.getElementById('stream-filter');
    const visitsFilter         = document.getElementById('visits-filter');
    const ratingFilter         = document.getElementById('rating-filter');
    const sectionFilter        = document.getElementById('section-filter');
    const campsiteSelect       = document.getElementById('campsite-select');
    const radiusSelect         = document.getElementById('radius-select');
    const backupDistanceSelect = document.getElementById('backup-distance-select');
    const tripDaysSelect       = document.getElementById('trip-days-select');
    const errorDiv             = document.getElementById('trip-plan-error');
    const loadingDiv           = document.getElementById('trip-plan-loading');

    if (!monthSelect || !streamFilter || !visitsFilter || !ratingFilter ||
        !sectionFilter || !campsiteSelect || !radiusSelect || !backupDistanceSelect || !tripDaysSelect) return;
    if (!processedData || !allData) return;

    if (errorDiv) { errorDiv.textContent = ''; errorDiv.style.display = 'none'; }
    if (loadingDiv) loadingDiv.style.display = 'block';

    const selectedMonth      = monthSelect.value || 'ALL';
    const streamFilterValue  = streamFilter.value ? streamFilter.value.toLowerCase() : '';
    const visitsFilterValue  = visitsFilter.value || '';
    const ratingFilterValue  = ratingFilter.value || '';
    const sectionFilterValue = sectionFilter.value || 'All';
    const selectedCampsite   = campsiteSelect.value;
    const selectedRadius     = radiusSelect.value;
    const maxBackupDistance  = parseFloat(backupDistanceSelect.value) || 20;
    const numDays            = parseInt(tripDaysSelect.value) || 3;
    const numRadius          = selectedRadius === 'ALL' ? 30 : parseFloat(selectedRadius);
    const yearsBack          = parseInt(document.getElementById('years-back-select')?.value) || 0;

    // Re-group trips filtered to the selected time window
    const cutoff = yearsBack > 0
        ? new Date(Date.now() - yearsBack * 365.25 * 24 * 60 * 60 * 1000)
        : null;
    const timeRows = cutoff ? validRows.filter(r => r.date && r.date >= cutoff) : validRows;
    const { processed: localProcessed, all: localAll, avg: localAvg } = buildGroupedData(timeRows);
    globalAvgRating = localAvg; // keep confidence scoring calibrated to this window

    const rowsToProcess = selectedMonth === 'ALL'
        ? localAll
        : localProcessed.filter(row => row.month === selectedMonth);

    // Base pool: apply name/visits/rating/section filters, no campsite restriction
    const basePool = rowsToProcess.map(row => ({
        ...row,
        precipitationPast:   row.midpoint ? '...' : 'N/A',
        precipitationFuture: row.midpoint ? '...' : 'N/A'
    })).filter(row => {
        const stream  = row.stream.toLowerCase();
        const visits  = parseFloat(row.visits);
        const rating  = parseFloat(row.rating);
        const section = row.section;
        return stream.includes(streamFilterValue) &&
               (visitsFilterValue === '' || visits >= parseFloat(visitsFilterValue)) &&
               (ratingFilterValue === '' || rating >= parseFloat(ratingFilterValue)) &&
               (sectionFilterValue === 'All' || section === sectionFilterValue);
    });

    if (selectedCampsite === 'ALL') {
        // Auto mode: score all campsites and show top 2
        const topCampsites = getTopCampsites(basePool, numRadius);
        displayCampsitePlans(topCampsites, numDays, maxBackupDistance, basePool);
    } else {
        // Specific campsite: filter base pool by distance to that campsite
        const [campLat, campLon] = selectedCampsite.split(',').map(parseFloat);
        const nearbyStreams = basePool.filter(row => {
            if (!row.midpoint) return false;
            return haversineDistance(row.midpoint.lat, row.midpoint.lon, campLat, campLon) <= numRadius;
        });
        const campRow = campsiteData.rows.find(r => r[1]?.trim() === selectedCampsite);
        const campName = campRow?.[0]?.trim() || 'Selected Campsite';
        displayCampsitePlans(
            [{ name: campName, lat: campLat, lon: campLon, count: nearbyStreams.length, nearby: nearbyStreams }],
            numDays, maxBackupDistance, basePool
        );
    }

    // Stream pool uses the full base pool (no campsite restriction)
    streamPoolData = basePool.map(row => ({ ...row }));
    if (isStreamPoolVisible) rebuildStreamPool();

    if (loadingDiv) loadingDiv.style.display = 'none';
}

function clearFilters() {
    const streamFilter   = document.getElementById('stream-filter');
    const visitsFilter   = document.getElementById('visits-filter');
    const ratingFilter   = document.getElementById('rating-filter');
    const sectionFilter  = document.getElementById('section-filter');
    const campsiteSelect = document.getElementById('campsite-select');
    const radiusSelect   = document.getElementById('radius-select');
    const backupDistSel  = document.getElementById('backup-distance-select');
    const tripDaysSel    = document.getElementById('trip-days-select');

    if (streamFilter)  streamFilter.value  = '';
    if (visitsFilter)  visitsFilter.value  = '';
    if (ratingFilter)  ratingFilter.value  = '';
    if (sectionFilter) sectionFilter.value = 'All';
    if (campsiteSelect) campsiteSelect.value = 'ALL'; // returns to auto top-2 mode
    if (radiusSelect)  radiusSelect.value  = '30';
    if (backupDistSel) backupDistSel.value = '20';
    if (tripDaysSel)   tripDaysSel.value   = '3';
    const yearsBackSel = document.getElementById('years-back-select');
    if (yearsBackSel)  yearsBackSel.value  = '4';

    // Re-select current month
    const monthSelect = document.getElementById('month-select');
    if (monthSelect && processedData) {
        const currentMonth = new Date().toLocaleString('default', { month: 'long' });
        const options = Array.from(monthSelect.options);
        const match = options.find(o => o.value === currentMonth);
        monthSelect.value = match ? currentMonth : 'ALL';
    }

    sortColumn    = 'Visits';
    sortDirection = -1;
    applyFilters();
}

function toggleStreamPool() {
    isStreamPoolVisible = !isStreamPoolVisible;
    const wrapper = document.getElementById('stream-pool-wrapper');
    const btn     = document.getElementById('toggle-stream-pool');
    if (!wrapper || !btn) return;
    wrapper.style.display = isStreamPoolVisible ? 'block' : 'none';
    btn.textContent = isStreamPoolVisible ? 'Hide Stream Pool' : 'Show Stream Pool';
    if (isStreamPoolVisible && streamPoolData.length > 0) {
        rebuildStreamPool();
    }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────

async function fetchSourceData() {
    const loadingDiv = document.getElementById('trip-plan-loading');
    const errorDiv   = document.getElementById('trip-plan-error');

    try {
        if (loadingDiv) loadingDiv.style.display = 'block';
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status} fetching data`);
        const data = await response.json();
        if (!data.source || !data.campsites) throw new Error('Invalid data format in streams.json');
        sourceData   = data.source;
        campsiteData = data.campsites;
        dnrRegData   = data.dnr_regulations || {};
        processSourceData();
        populateMonthDropdown();
        populateCampsiteDropdown();
        await applyFilters();
        if (errorDiv) { errorDiv.textContent = ''; errorDiv.style.display = 'none'; }
    } catch (error) {
        if (errorDiv) { errorDiv.textContent = `Error: ${error.message}`; errorDiv.style.display = 'block'; }
    } finally {
        if (loadingDiv) loadingDiv.style.display = 'none';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    // Default trip date to next Saturday
    const dateInput = document.getElementById('trip-date');
    if (dateInput) dateInput.value = nextSaturday();

    isStreamPoolVisible = false;
    fetchSourceData();
});
